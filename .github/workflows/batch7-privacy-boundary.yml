name: Batch 7 Remote Planner Privacy Boundary

on:
  push:
    branches:
      - master
    paths:
      - .github/batch7-privacy-trigger.txt

permissions:
  contents: write
  issues: write

concurrency:
  group: batch7-remote-planner-privacy
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Publish observable run marker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/issues/5/comments" \
            -f body="Batch 7 BBCR-003/006 source closure started: head \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`, job \`apply-and-validate\`."

      - name: Refuse unexpected repository state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 6398cb600304ceaa21027af1ba7d8a81a55476bc HEAD
          test -z "$(git status --porcelain)"
          test -f scripts/batch7-privacy-boundary.py
          test -f .github/workflows/batch7-privacy-boundary.yml
          test -f .github/batch7-privacy-trigger.txt
          test -z "$(git branch --show-current)"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Ubuntu native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply typed privacy and hostile-input boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/batch7-privacy-boundary.py")
          text = path.read_text()
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)
          '''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              expected = 2 if label == "redact OpenAI invalid response" else 1
              if count != expected:
                  raise SystemExit(f"{label}: expected exactly {expected} match(es), found {count}")
              return text.replace(old, new, 1)
          '''
          if text.count(old) != 1:
              raise SystemExit("Batch 7 transformer correction baseline did not match exactly once")
          text = text.replace(old, new, 1)

          derive_old = '#[derive(Debug, Clone, Serialize, PartialEq, Eq)]\\npub(crate) struct RemoteToolObservation {'
          derive_new = '#[derive(Debug, Clone, Serialize, PartialEq)]\\npub(crate) struct RemoteToolObservation {'
          if text.count(derive_old) != 1:
              raise SystemExit("RemoteToolObservation derive correction did not match exactly once")
          text = text.replace(derive_old, derive_new, 1)
          path.write_text(text)
          PY
          python3 scripts/batch7-privacy-boundary.py

      - name: Format transformed Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Verify transformed invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          redaction = Path("src-tauri/src/app_core/planner_redaction.rs").read_text()
          prompt = Path("src-tauri/src/app_core/planner_prompt.rs").read_text()
          remote = Path("src-tauri/src/app_core/remote_planner.rs").read_text()

          required_redaction = [
              "pub(crate) struct RemotePlannerInput",
              "pub(crate) struct PlannerSafeElementAttributes",
              "remote_planner_high_risk_context_blocked",
              "#[derive(Debug, Clone, Serialize, PartialEq)]\npub(crate) struct RemoteToolObservation",
          ]
          required_prompt = [
              "trusted_contract",
              "user_request",
              "untrusted_data",
              "caution-only telemetry",
          ]
          for value in required_redaction:
              if value not in redaction:
                  raise SystemExit(f"missing transformed redaction invariant: {value}")
          for value in required_prompt:
              if value not in prompt:
                  raise SystemExit(f"missing transformed prompt invariant: {value}")

          counts = {
              "sanitize_remote_planner_input": remote.count(
                  "sanitize_remote_planner_input(planner_input)?"
              ),
              "serialize_remote_planner_prompt": remote.count(
                  "serialize_remote_planner_prompt(&planner_safe_input)?"
              ),
              "content_length_redaction": remote.count(
                  '"content_length": content.len()'
              ),
          }
          print(f"Batch 7 invariant counts: {counts}")
          expected = {
              "sanitize_remote_planner_input": 2,
              "serialize_remote_planner_prompt": 2,
              "content_length_redaction": 2,
          }
          if counts != expected:
              raise SystemExit(f"unexpected Batch 7 invariant counts: {counts}")

          forbidden = {
              "legacy raw planner payload": "pub(crate) planner_input:",
              "raw remote response body": '"content": content',
              "unnecessary ToolName Eq requirement": "#[derive(Debug, Clone, Serialize, PartialEq, Eq)]\npub(crate) struct RemoteToolObservation",
          }
          for label, value in forbidden.items():
              if value in prompt or value in redaction or value in remote:
                  raise SystemExit(f"forbidden {label} remains: {value}")
          PY
          git diff --check

      - name: Check for reintroduced silent-fallback patterns
        run: bash scripts/check-silent-fallbacks.sh

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check default feature configuration
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Run frontend lint
        run: pnpm lint

      - name: Run UI tests
        run: pnpm test:ui

      - name: Build frontend
        run: pnpm build

      - name: Remove one-shot Batch 7 machinery
        shell: bash
        run: |
          rm scripts/batch7-privacy-boundary.py
          rm .github/workflows/batch7-privacy-boundary.yml
          rm .github/batch7-privacy-trigger.txt
          git diff --check

      - name: Commit validated source to master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src-tauri/src/app_core/planner_redaction.rs \
            src-tauri/src/app_core/planner_prompt.rs \
            src-tauri/src/app_core/remote_planner.rs \
            scripts/batch7-privacy-boundary.py \
            .github/workflows/batch7-privacy-boundary.yml \
            .github/batch7-privacy-trigger.txt
          git diff --cached --check
          git commit -m "security: type remote planner privacy boundary"
          source_sha="$(git rev-parse HEAD)"
          git push origin HEAD:master
          git push origin --delete agent/tmp-do-not-use || true
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/issues/5/comments" \
            -f body="Batch 7 BBCR-003/006 source closure passed and was committed to master: trigger head \`${GITHUB_SHA}\`, source commit \`${source_sha}\`, run \`${GITHUB_RUN_ID}\`, job \`apply-and-validate\`."

      - name: Publish failure marker
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/issues/5/comments" \
            -f body="Batch 7 BBCR-003/006 source closure failed: head \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`, job \`apply-and-validate\`. Inspect the failed step and job log; no production source commit was published."
