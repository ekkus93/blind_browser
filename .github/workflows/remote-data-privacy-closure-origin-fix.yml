name: Remote Data Privacy Closure Origin Fix

on:
  push:
    branches:
      - master
    paths:
      - .github/remote-data-privacy-closure-origin-fix.trigger

permissions:
  contents: write

jobs:
  apply-validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply bounded closure source
        shell: bash
        run: |
          set -euo pipefail
          parts=(.github/remote-data-privacy-closure-batch1.patch.gz.b64.part-??)
          test "${#parts[@]}" -eq 6
          cat "${parts[@]}" > /tmp/closure.patch.gz.b64
          echo "38fe67435dc1305b2a526d598415e5f25fccc9ba51d1375e07661577d0296a7b  /tmp/closure.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/closure.patch.gz.b64 > /tmp/closure.patch.gz
          gzip -t /tmp/closure.patch.gz
          gzip -dc /tmp/closure.patch.gz > /tmp/closure.patch
          echo "e465efe86d24f1ba26ef359593e5c124afc40ded0f0f17da29af69ff8825399d  /tmp/closure.patch" | sha256sum -c -
          git apply --check /tmp/closure.patch
          git apply /tmp/closure.patch

          python3 - <<'PY'
          import json
          from pathlib import Path

          consent_path = Path("src-tauri/src/app_core/remote_data_consent.rs")
          consent_text = consent_path.read_text(encoding="utf-8")
          mutation_old = "        let mutations: Vec<Box<dyn Fn(&mut RemotePlannerConsentManifest)>> = vec!["
          mutation_new = (
              "        type ManifestMutation = Box<dyn Fn(&mut RemotePlannerConsentManifest)>;\n\n"
              "        let mutations: Vec<ManifestMutation> = vec!["
          )
          if consent_text.count(mutation_old) != 1:
              raise SystemExit(
                  "expected exactly one remote consent mutation vector for strict-Clippy repair"
              )
          consent_path.write_text(
              consent_text.replace(mutation_old, mutation_new), encoding="utf-8"
          )

          test_path = Path(
              "src-tauri/src/app_core/tests/remote_data_consent_evidence_tests.rs"
          )
          test_text = test_path.read_text(encoding="utf-8")
          profile_old = 'const PROFILE: &str = "remote-consent-evidence";'
          profile_new = 'const PROFILE: &str = "openai-default";'
          config_old = "    core.config = AppConfig::default();"
          config_new = """    core.config = AppConfig::persist_remote_planner_connection_settings_for_app(
              app.handle(),
              PROFILE,
              "https://api.example.com/v1",
              MODEL,
          )
          .expect("test planner destination should be persisted");"""
          if test_text.count(profile_old) != 1:
              raise SystemExit(
                  "expected exactly one remote consent evidence profile constant"
              )
          if test_text.count(config_old) != 1:
              raise SystemExit(
                  "expected exactly one in-memory-only consent fixture initialization"
              )
          test_text = test_text.replace(profile_old, profile_new)
          test_text = test_text.replace(config_old, config_new)
          test_path.write_text(test_text, encoding="utf-8")

          frontend_path = Path("src/remote-planner-privacy-ui.tsx")
          frontend_text = frontend_path.read_text(encoding="utf-8")
          frontend_anchor = '} from "react";\n\n'
          frontend_import = (
              '} from "react";\n\n'
              'import {\n'
              '  activateConsentDialogFocus,\n'
              '  handleConsentDialogKeyboard,\n'
              '} from "./remote-planner-consent-dialog-interactions.ts";\n\n'
          )
          if frontend_text.count(frontend_anchor) != 1:
              raise SystemExit(
                  "expected exactly one React import boundary for consent helper repair"
              )
          frontend_path.write_text(
              frontend_text.replace(frontend_anchor, frontend_import),
              encoding="utf-8",
          )

          redaction_path = Path("src-tauri/src/app_core/planner_redaction.rs")
          redaction_text = redaction_path.read_text(encoding="utf-8")
          origin_old = """pub(crate) fn planner_page_origin(input: &PlannerInput) -> Option<String> {
              [
                  input.agent_state.url.as_deref(),
                  input
                      .page_model
                      .as_ref()
                      .and_then(|page| page.url.as_deref()),
                  input
                      .page_snapshot
                      .as_ref()
                      .map(|snapshot| snapshot.url.as_str()),
              ]
              .into_iter()
              .flatten()
              .find_map(|raw| {
                  url::Url::parse(raw)
                      .ok()
                      .map(|url| url.origin().ascii_serialization())
              })
          }
          """
          origin_new = """pub(crate) fn planner_page_origin(input: &PlannerInput) -> Option<String> {
              let raw = input
                  .agent_state
                  .url
                  .as_deref()
                  .or_else(|| {
                      input
                          .page_model
                          .as_ref()
                          .and_then(|page| page.url.as_deref())
                  })
                  .or_else(|| {
                      input
                          .page_snapshot
                          .as_ref()
                          .map(|snapshot| snapshot.url.as_str())
                  })?;
              let url = match url::Url::parse(raw) {
                  Ok(url) => url,
                  Err(_) => return None,
              };
              let origin = url.origin();
              origin.is_tuple().then(|| origin.ascii_serialization())
          }
          """
          if redaction_text.count(origin_old) != 1:
              raise SystemExit(
                  "expected exactly one permissive planner origin fallback for fail-closed repair"
              )
          redaction_path.write_text(
              redaction_text.replace(origin_old, origin_new), encoding="utf-8"
          )

          allowlist_path = Path("scripts/security-fallback-allowlist.txt")
          allowlist_text = allowlist_path.read_text(encoding="utf-8")
          allowlist_entry = "src-tauri/src/app_core/planner_redaction.rs|.ok()\n"
          if allowlist_text.count(allowlist_entry) != 1:
              raise SystemExit(
                  "expected exactly one planner_page_origin fallback allowlist entry"
              )
          allowlist_path.write_text(
              allowlist_text.replace(allowlist_entry, ""), encoding="utf-8"
          )

          inventory_path = Path("scripts/security-fallback-inventory.json")
          inventory = json.loads(inventory_path.read_text(encoding="utf-8"))
          match_indexes = [
              index
              for index, entry in enumerate(inventory["entries"])
              if entry.get("path") == "src-tauri/src/app_core/planner_redaction.rs"
              and entry.get("function") == "planner_page_origin"
              and entry.get("expression") == ".ok()"
          ]
          if len(match_indexes) != 1:
              raise SystemExit(
                  "expected exactly one planner_page_origin fallback inventory entry"
              )
          del inventory["entries"][match_indexes[0]]
          inventory_path.write_text(
              json.dumps(inventory, indent=2) + "\n", encoding="utf-8"
          )

          documentation_path = Path(
              "docs/BLIND_BROWSER_ACCEPTED_FALLBACKS_2026-08-02.md"
          )
          documentation = documentation_path.read_text(encoding="utf-8")
          replacements = {
              "- `permanent_accepted`: **23**": "- `permanent_accepted`: **22**",
              "- converted or removed across post-P8 passes: **17**": "- converted or removed across post-P8 passes: **18**",
              "| Optional form destination/origin parsing | Invalid optional URL metadata becomes `None` | Missing destination/origin cannot authorize submission and keeps confirmation conservative | Confirmation warnings identify unavailable destination/page metadata | Retain `Option` unless UI requires typed URL-parse reasons |": "| Optional form destination parsing | Invalid optional form-action URL metadata becomes `None` | Missing destination cannot authorize submission and keeps confirmation conservative | Confirmation warnings identify unavailable destination metadata | Retain `Option` unless UI requires typed URL-parse reasons |",
              "| Planner page-origin metadata | Invalid optional origin is omitted after privacy controls remain authoritative | Cannot bypass remote-data consent, high-risk blocking, or credential scoping | Origin is unavailable/redacted | Add typed reason only if privacy UI needs it |\n": "",
              "The post-P8 passes removed or converted seventeen exact accepted expressions:": "The post-P8 passes removed or converted eighteen exact accepted expressions:",
              "- recent fill-correction candidate `.ok()` omission.\n": "- recent fill-correction candidate `.ok()` omission;\n- planner page-origin parse `.ok()` fallback and lower-priority URL fallthrough.\n",
              "- explicit policy-detail serialization failure markers.\n": "- explicit policy-detail serialization failure markers;\n- authoritative first-present page URL parsing with explicit rejection of parse failures and non-tuple origins.\n",
          }
          for old, new in replacements.items():
              if documentation.count(old) != 1:
                  raise SystemExit(
                      f"expected exactly one accepted-fallback documentation fragment: {old!r}"
                  )
              documentation = documentation.replace(old, new)
          documentation_path.write_text(documentation, encoding="utf-8")
          PY

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Ubuntu native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Rust source
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Run scanners
        run: |
          bash scripts/check-silent-fallbacks.sh
          python3 scripts/check-security-fallbacks.py --self-test
          python3 scripts/check-security-fallbacks.py
          python3 scripts/check-security-fallback-inventory.py --self-test
          python3 scripts/check-security-fallback-inventory.py
          python3 scripts/check-sensitive-diagnostics.py --self-test
          python3 scripts/check-sensitive-diagnostics.py
          python3 scripts/check-remote-planner-privacy-state.py --self-test
          python3 scripts/check-remote-planner-privacy-state.py

      - name: Validate opaque-origin fail-closed evidence
        run: |
          xvfb-run -a cargo test \
            --manifest-path src-tauri/Cargo.toml \
            --all-features \
            app_core::tests::remote_data_consent_evidence_tests::remote_data_privacy_closure_policy_and_disclosure_matrix_is_bounded \
            -- --exact --nocapture --test-threads=1

      - name: Validate Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-features --test post_batch8_direct_command_policy_evidence
          bash scripts/run-rust-tests-linux.sh

      - name: Validate frontend
        run: |
          pnpm lint
          pnpm test:ui
          pnpm build

      - name: Remove bounded machinery and publish source
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/remote-data-privacy-closure-apply.yml \
            .github/remote-data-privacy-closure-apply.trigger \
            .github/workflows/remote-data-privacy-closure-origin-fix.yml \
            .github/remote-data-privacy-closure-origin-fix.trigger \
            .github/workflows/remote-data-privacy-closure-frontend-diagnostic.yml \
            .github/remote-data-privacy-closure-frontend-diagnostic.trigger \
            .github/remote-data-privacy-closure-batch1.patch.gz.b64 \
            .github/remote-data-privacy-closure-batch1.patch.gz.b64.part-* \
            .github/workflows/remote-data-privacy-closure-export.yml \
            .github/remote-data-privacy-closure-export.trigger
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "test: close remote data privacy evidence gaps"
          git push origin HEAD:master
