name: Post-Batch-8 source diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply bounded product patch and repairs
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/postbatch8-apply.patch.gz.b64.* > /tmp/postbatch8.patch.gz.b64
          base64 --decode /tmp/postbatch8.patch.gz.b64 | gzip --decompress > /tmp/postbatch8.patch
          git apply --check /tmp/postbatch8.patch
          git apply /tmp/postbatch8.patch
          python3 scripts/postbatch8-compile-fixes.py

      - name: Print bounded source excerpts
        shell: bash
        run: |
          set -uo pipefail
          echo '=== MODEL DOWNLOAD HTTP PATHS ==='
          grep -n -B 35 -A 150 'partial-\|fn download_\|download_verified\|VerifiedDownload' src-tauri/src/app_core/model_management.rs || true
          echo '=== MODEL DOWNLOAD FAILING TESTS ==='
          for name in \
            truncated_payload_is_rejected \
            checksum_mismatch_keeps_existing_file_and_removes_partial \
            declared_size_mismatch_rejects_download \
            redirect_to_unapproved_origin_is_rejected \
            successful_verified_download_replaces_existing_file_atomically; do
            grep -n -B 25 -A 55 "fn $name" src-tauri/src/app_core/model_management.rs || true
          done
          echo '=== HELPER COMMAND DEFINITIONS ==='
          grep -R -n -B 20 -A 60 'fn read_data_url_text\|fn resolve_external_url' src-tauri/src || true
          echo '=== DIRECT COMMAND POLICY ==='
          sed -n '1,320p' src-tauri/src/direct_command_policy.rs || true
          echo '=== DIAGNOSTICS SANITIZER AND TEST ==='
          grep -n -B 40 -A 120 'sanitize_message_redacts_sensitive_values\|fn sanitize_message' src-tauri/src/diagnostics.rs || true
