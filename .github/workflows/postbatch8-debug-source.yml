name: Post-Batch-8 compact source diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: postbatch8-source-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply bounded product patch and repairs
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/postbatch8-apply.patch.gz.b64.* > /tmp/postbatch8.patch.gz.b64
          base64 --decode /tmp/postbatch8.patch.gz.b64 | gzip --decompress > /tmp/postbatch8.patch
          git apply --check /tmp/postbatch8.patch
          git apply /tmp/postbatch8.patch
          python3 scripts/postbatch8-compile-fixes.py

      - name: Print only the two failing contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          excerpts = (
              ("MODEL MANAGEMENT", "src-tauri/src/app_core/model_management.rs", 680, 805),
              ("EXTERNAL URL HANDLER", "src-tauri/src/command_handlers/url_handlers.rs", 70, 150),
          )
          for title, path, first, last in excerpts:
              lines = Path(path).read_text(encoding="utf-8").splitlines()
              print(f"=== {title}: {path}:{first}-{last} ===")
              for number in range(first, min(last, len(lines)) + 1):
                  print(f"{number:04d}: {lines[number - 1]}")
          PY
