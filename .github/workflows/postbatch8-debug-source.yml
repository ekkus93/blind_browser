name: Post-Batch-8 targeted test diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: postbatch8-test-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply bounded product patch and repairs
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/postbatch8-apply.patch.gz.b64.* > /tmp/postbatch8.patch.gz.b64
          base64 --decode /tmp/postbatch8.patch.gz.b64 | gzip --decompress > /tmp/postbatch8.patch
          git apply --check /tmp/postbatch8.patch
          git apply /tmp/postbatch8.patch
          python3 scripts/postbatch8-compile-fixes.py

      - name: Print exact failing source regions
        shell: bash
        run: |
          set -euo pipefail
          echo '=== MODEL MANAGEMENT AROUND PANIC ==='
          nl -ba src-tauri/src/app_core/model_management.rs | sed -n '700,810p'
          echo '=== MODEL SIZE TEST ==='
          grep -n -B 45 -A 100 'too_small_and_too_large_files_fail_before_replacement' \
            src-tauri/src/app_core/model_management.rs
          echo '=== URL HANDLER AROUND PANIC ==='
          nl -ba src-tauri/src/command_handlers/url_handlers.rs | sed -n '70,165p'
          echo '=== URL VALIDATION TEST ==='
          grep -n -B 40 -A 100 'external_url_validation_rejects_unsafe_forms' \
            src-tauri/src/command_handlers/url_handlers.rs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Run exact failing tests
        shell: bash
        env:
          RUST_BACKTRACE: "0"
        run: |
          set +e
          xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features \
            too_small_and_too_large_files_fail_before_replacement -- --nocapture \
            > /tmp/model-size-test.log 2>&1
          model_status=$?
          xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features \
            external_url_validation_rejects_unsafe_forms -- --nocapture \
            > /tmp/url-test.log 2>&1
          url_status=$?
          set -e
          echo '=== MODEL SIZE TEST OUTPUT ==='
          cat /tmp/model-size-test.log
          echo '=== URL VALIDATION TEST OUTPUT ==='
          cat /tmp/url-test.log
          if test "$model_status" -ne 0 || test "$url_status" -ne 0; then
            exit 1
          fi
