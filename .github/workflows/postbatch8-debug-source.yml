name: Post-Batch-8 all-feature test diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: postbatch8-test-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply bounded product patch and repairs
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/postbatch8-apply.patch.gz.b64.* > /tmp/postbatch8.patch.gz.b64
          base64 --decode /tmp/postbatch8.patch.gz.b64 | gzip --decompress > /tmp/postbatch8.patch
          git apply --check /tmp/postbatch8.patch
          git apply /tmp/postbatch8.patch
          python3 scripts/postbatch8-compile-fixes.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Run all-feature tests with compact failure output
        shell: bash
        env:
          RUST_BACKTRACE: "0"
        run: |
          set +e
          xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features -- --nocapture \
            > /tmp/all-feature-tests.log 2>&1
          status=$?
          set -e
          echo '=== ALL-FEATURE FAILURE EXCERPTS ==='
          grep -n -E \
            'FAILED|failures:|panicked at|assertion .* failed|left:|right:|test result: FAILED|error: test failed' \
            /tmp/all-feature-tests.log | tail -n 300 || true
          echo '=== FINAL TEST LOG TAIL ==='
          tail -n 180 /tmp/all-feature-tests.log
          exit "$status"
