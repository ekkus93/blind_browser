name: Post-Batch-8 validator source diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: postbatch8-source-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply bounded product patch and repairs
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/postbatch8-apply.patch.gz.b64.* > /tmp/postbatch8.patch.gz.b64
          base64 --decode /tmp/postbatch8.patch.gz.b64 | gzip --decompress > /tmp/postbatch8.patch
          git apply --check /tmp/postbatch8.patch
          git apply /tmp/postbatch8.patch
          python3 scripts/postbatch8-compile-fixes.py

      - name: Print exact validator implementations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def numbered(path: str, first: int, last: int) -> None:
              lines = Path(path).read_text(encoding="utf-8").splitlines()
              print(f"=== {path}:{first}-{last} ===")
              for number in range(first, min(last, len(lines)) + 1):
                  print(f"{number:04d}: {lines[number - 1]}")

          numbered("src-tauri/src/command_handlers/url_handlers.rs", 1, 72)

          path = "src-tauri/src/app_core/model_management.rs"
          lines = Path(path).read_text(encoding="utf-8").splitlines()
          needle = "fn write_verified_reader_atomically"
          starts = [index for index, line in enumerate(lines) if needle in line]
          if len(starts) != 1:
              raise SystemExit(f"expected one {needle}, found {len(starts)}")
          first = max(1, starts[0] + 1 - 15)
          last = min(len(lines), starts[0] + 1 + 125)
          print(f"=== {path}:{first}-{last} ===")
          for number in range(first, last + 1):
              print(f"{number:04d}: {lines[number - 1]}")
          PY
