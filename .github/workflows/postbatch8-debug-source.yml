name: Post-Batch-8 source diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply bounded product patch and repairs
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/postbatch8-apply.patch.gz.b64.* > /tmp/postbatch8.patch.gz.b64
          base64 --decode /tmp/postbatch8.patch.gz.b64 | gzip --decompress > /tmp/postbatch8.patch
          git apply --check /tmp/postbatch8.patch
          git apply /tmp/postbatch8.patch
          python3 scripts/postbatch8-compile-fixes.py

      - name: Print speech and local-inference command sources
        shell: bash
        run: |
          set -uo pipefail
          grep -R -n -B 40 -A 120 \
            -E 'get_local_inference_status|get_speech_capabilities_state|download_speech_artifact|delete_speech_artifact|update_whisper_config|update_tts_config|start_voice_capture|submit_voice_audio|synthesize_speech' \
            src-tauri/src || true
          echo '=== CURRENT POLICY REGISTRY ==='
          sed -n '1,520p' src-tauri/src/direct_command_policy.rs
          echo '=== POLICY DOCUMENTATION ==='
          sed -n '1,420p' docs/DIRECT_COMMAND_POLICY_REGISTRY.md || true
