name: Post-Batch-8 source diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply bounded product patch and repairs
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/postbatch8-apply.patch.gz.b64.* > /tmp/postbatch8.patch.gz.b64
          base64 --decode /tmp/postbatch8.patch.gz.b64 | gzip --decompress > /tmp/postbatch8.patch
          git apply --check /tmp/postbatch8.patch
          git apply /tmp/postbatch8.patch
          python3 scripts/postbatch8-compile-fixes.py

      - name: Print exact source matches
        shell: bash
        run: |
          set -uo pipefail
          echo '=== FILE INVENTORY ==='
          find src-tauri/src -maxdepth 4 -type f | sort | grep -E 'model|download|diagnostic|command|external|data_url' || true
          echo '=== FAILING MODEL TEST SOURCES ==='
          grep -R -n -B 35 -A 65 \
            -E 'truncated_payload_is_rejected|checksum_mismatch_keeps_existing_file_and_removes_partial|declared_size_mismatch_rejects_download|redirect_to_unapproved_origin_is_rejected|successful_verified_download_replaces_existing_file_atomically' \
            src-tauri/src || true
          echo '=== RANDOM PARTIAL IMPLEMENTATION ==='
          grep -R -n -B 45 -A 140 -E 'partial-|IntegrityMismatch|RedirectBlocked' src-tauri/src || true
          echo '=== HELPER COMMAND SOURCES ==='
          grep -R -n -B 30 -A 80 -E 'read_data_url_text|resolve_external_url' src-tauri/src || true
          echo '=== DIAGNOSTICS SOURCES ==='
          grep -R -n -B 45 -A 130 -E 'sanitize_message_redacts_sensitive_values|fn sanitize_message|api_key=\[REDACTED\]' src-tauri/src || true
