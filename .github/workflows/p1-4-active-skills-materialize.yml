name: P1.4 bound-skill materialize

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/p1-4-active-skills-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    if: "${{ github.event.head_commit.message == 'ci: materialize P1.4 bound-skill validation' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct exact P1.4 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          cat > /tmp/p14.patch.gz.b64 <<'PATCH'
          
          PATCH
          tr -d '[:space:]' < /tmp/p14.patch.gz.b64 | base64 --decode > /tmp/p14.patch.gz
          echo '121222c011e2904c1baf1860e1f1af849f869b58974b3877c1e3b2e9f07aac14  /tmp/p14.patch.gz' | sha256sum --check --strict
          gzip --test /tmp/p14.patch.gz
          gzip --decompress --stdout /tmp/p14.patch.gz > /tmp/p14.patch
          echo '4d94408fdcda0d224c6ce6db905dadaed07e63e6639f8ce72e351c250088d6ec  /tmp/p14.patch' | sha256sum --check --strict
          git apply --check /tmp/p14.patch
          git apply /tmp/p14.patch

      - name: Format candidate
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rustfmt and verify scope
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            src-tauri/src/app_core/command_dispatch.rs
            src-tauri/src/app_core/planning_snapshot.rs
            src-tauri/src/app_core/replanning_orchestrator.rs
            src-tauri/src/app_core/tests/remote_data_consent_evidence_tests/policy_and_disclosure_matrix_tests.rs
            src-tauri/src/state.rs
          )
          test "${changed[*]}" = "${expected[*]}"

      - name: Commit formatted source directly to master
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p1-4-active-skills-materialize.yml
          git add src-tauri/src
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: revalidate planner output against bound skills'
          git push origin HEAD:master
