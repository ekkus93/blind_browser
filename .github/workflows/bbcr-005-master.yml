name: BBCR-005 Direct Master Worker

on:
  issues:
    types:
      - edited

permissions:
  contents: write
  issues: write

concurrency:
  group: bbcr-005-direct-master
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.event.issue.number == 5 && github.repository == 'ekkus93/blind_browser' && github.actor == 'ekkus93' && contains(github.event.issue.body, '<!-- bbcr-005-trigger: run-1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse unexpected repository state
        shell: bash
        run: |
          test "$(git branch --show-current)" = "master"
          test -f scripts/bbcr005_master.py
          test -f .github/workflows/bbcr-005-master.yml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Ubuntu native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr

      - name: Apply deterministic Batch 5 transformation
        id: transform
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/bbcr005_master.py 2>&1 | tee "${RUNNER_TEMP}/bbcr005-transform.log"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Format transformed Rust
        shell: bash
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Check for reintroduced silent-fallback patterns
        shell: bash
        run: bash scripts/check-silent-fallbacks.sh

      - name: Check default feature configuration
        id: cargo_check
        shell: bash
        run: |
          set -o pipefail
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee "${RUNNER_TEMP}/bbcr005-check.log"

      - name: Run Rust clippy
        id: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings 2>&1 | tee "${RUNNER_TEMP}/bbcr005-clippy.log"

      - name: Run Rust tests
        id: rust_tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --all-features -- --nocapture 2>&1 | tee "${RUNNER_TEMP}/bbcr005-tests.log"

      - name: Run frontend lint
        run: pnpm lint

      - name: Run UI tests
        run: pnpm test:ui

      - name: Build frontend
        run: pnpm build

      - name: Verify formatting and whitespace
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          git diff --check

      - name: Publish exact failure diagnostic
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue_body="${RUNNER_TEMP}/issue-body.md"
          gh issue view 5 --repo "${GITHUB_REPOSITORY}" --json body --jq .body >"${issue_body}"
          {
            echo
            echo '---'
            echo
            echo '## BBCR-005 direct-master diagnostic'
            echo
            echo "- **Status:** \`validation_failure\`"
            echo "- **Evaluated master head:** \`$(git rev-parse HEAD)\`"
            echo "- **Run:** \`${GITHUB_RUN_ID}\`"
            echo "- **Job:** \`${GITHUB_JOB}\`"
            echo
            for log in \
              "${RUNNER_TEMP}/bbcr005-transform.log" \
              "${RUNNER_TEMP}/bbcr005-check.log" \
              "${RUNNER_TEMP}/bbcr005-clippy.log" \
              "${RUNNER_TEMP}/bbcr005-tests.log"; do
              if test -s "${log}"; then
                echo "### $(basename "${log}")"
                echo
                echo '```text'
                tail -n 240 "${log}"
                echo '```'
                echo
              fi
            done
            echo 'No Batch 5 completion claim is made.'
          } >>"${issue_body}"
          gh issue edit 5 --repo "${GITHUB_REPOSITORY}" --body-file "${issue_body}"

      - name: Remove one-shot worker files
        run: |
          rm scripts/bbcr005_master.py
          rm .github/workflows/bbcr-005-master.yml

      - name: Commit validated Batch 5 implementation to master
        run: |
          git config user.name "ekkus93"
          git config user.email "1386709+ekkus93@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security: bind page actions to current runtime state"
          git push origin HEAD:master
