name: BBCR-015 Direct Master Closure

on:
  push:
    branches:
      - master
    paths:
      - .github/bbcr005-close15-trigger.txt

permissions:
  contents: write
  issues: write

concurrency:
  group: bbcr-015-direct-master-closure
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.repository == 'ekkus93/blind_browser'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact master trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse unexpected repository state
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f scripts/bbcr005_close15.py
          test -f scripts/bbcr005_close15_patch1.py
          test -f scripts/bbcr005_close15_patch2.py
          test -f scripts/bbcr005_close15_patch3.py
          test -f .github/workflows/bbcr-005-close15.yml
          test -f .github/bbcr005-close15-trigger.txt

      - name: Publish observable run marker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 5 --repo "${GITHUB_REPOSITORY}" --body "BBCR-015 closure run started: head \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`, job \`${GITHUB_JOB}\`. Superseded runs are cancelled by the workflow concurrency policy."

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Ubuntu native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr

      - name: Apply deterministic BBCR-015 closure
        id: transform
        shell: bash
        run: |
          set -o pipefail
          {
            python3 scripts/bbcr005_close15.py
            python3 scripts/bbcr005_close15_patch1.py
            python3 scripts/bbcr005_close15_patch2.py
            python3 scripts/bbcr005_close15_patch3.py
          } 2>&1 | tee "${RUNNER_TEMP}/bbcr015-transform.log"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Format transformed Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Check for reintroduced silent-fallback patterns
        run: bash scripts/check-silent-fallbacks.sh

      - name: Check default feature configuration
        id: cargo_check
        shell: bash
        run: |
          set -o pipefail
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee "${RUNNER_TEMP}/bbcr015-check.log"

      - name: Run Rust clippy
        id: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings 2>&1 | tee "${RUNNER_TEMP}/bbcr015-clippy.log"

      - name: Run Rust tests
        id: rust_tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --all-features -- --nocapture 2>&1 | tee "${RUNNER_TEMP}/bbcr015-tests.log"

      - name: Run frontend lint
        run: pnpm lint

      - name: Run UI tests
        run: pnpm test:ui

      - name: Build frontend
        run: pnpm build

      - name: Verify formatting and whitespace
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          git diff --check

      - name: Publish exact failure diagnostic
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue_body="${RUNNER_TEMP}/bbcr015-issue.md"
          gh issue view 5 --repo "${GITHUB_REPOSITORY}" --json body --jq .body >"${issue_body}"
          {
            echo
            echo '---'
            echo
            echo '## BBCR-015 direct-master closure diagnostic'
            echo
            echo "- **Status:** \`validation_failure\`"
            echo "- **Evaluated master head:** \`${GITHUB_SHA}\`"
            echo "- **Run:** \`${GITHUB_RUN_ID}\`"
            echo "- **Job:** \`${GITHUB_JOB}\`"
            echo
            for log in \
              "${RUNNER_TEMP}/bbcr015-transform.log" \
              "${RUNNER_TEMP}/bbcr015-check.log" \
              "${RUNNER_TEMP}/bbcr015-clippy.log" \
              "${RUNNER_TEMP}/bbcr015-tests.log"; do
              if test -s "${log}"; then
                echo "### $(basename "${log}")"
                echo
                echo '```text'
                tail -n 260 "${log}"
                echo '```'
                echo
              fi
            done
            echo 'No BBCR-015 completion claim is made.'
          } >>"${issue_body}"
          gh issue edit 5 --repo "${GITHUB_REPOSITORY}" --body-file "${issue_body}"
          gh issue comment 5 --repo "${GITHUB_REPOSITORY}" --body "BBCR-015 closure run failed: head \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`, job \`${GITHUB_JOB}\`. The exact diagnostic was appended to this issue."

      - name: Remove one-shot closure files
        run: |
          rm scripts/bbcr005_close15.py
          rm scripts/bbcr005_close15_patch1.py
          rm scripts/bbcr005_close15_patch2.py
          rm scripts/bbcr005_close15_patch3.py
          rm .github/workflows/bbcr-005-close15.yml
          rm .github/bbcr005-close15-trigger.txt

      - name: Commit validated BBCR-015 closure to master
        id: publish
        shell: bash
        run: |
          git config user.name "ekkus93"
          git config user.email "1386709+ekkus93@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security: replan stale runtime-bound actions"
          git push origin HEAD:master
          echo "commit_sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

      - name: Publish validated closure marker
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ steps.publish.outputs.commit_sha }}
        shell: bash
        run: |
          gh issue comment 5 --repo "${GITHUB_REPOSITORY}" --body "BBCR-015 source closure passed all worker gates and was committed to master: trigger head \`${GITHUB_SHA}\`, validated source commit \`${VALIDATED_SHA}\`, run \`${GITHUB_RUN_ID}\`, job \`${GITHUB_JOB}\`."
