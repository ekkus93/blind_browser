name: Batch 7 Report Summary Fix

on:
  push:
    branches:
      - master
    paths:
      - .github/batch7-report-summary-fix-trigger.txt

permissions:
  contents: write
  issues: write

env:
  BASE_SHA: e679097f7ae6be9fb5c4cc806d2ee9ed778acdba

jobs:
  fix-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refuse unexpected state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/batch7-report-summary-fix.yml',
              '.github/batch7-report-summary-fix-trigger.txt',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'e679097f7ae6be9fb5c4cc806d2ee9ed778acdba..HEAD'],
              text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected staging inventory: {sorted(changed)}')
          PY

      - name: Correct stale Batch 7 summary lines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/BLIND_BROWSER_COMPREHENSIVE_CODE_REVIEW_FIX_IMPLEMENTATION_REPORT_2026-08-01.md')
          text = path.read_text()
          replacements = {
              '- **BBCR-003:** Partially implemented; strong extraction and serialization redaction exists, but distinct remote-only types and consent policy remain open.':
              '- **BBCR-003:** Core typed remote-planner privacy and redaction boundary is implemented and validated. Explicit remote-data consent/per-origin controls, local relevance selection, and the broader tracing/UI/Redux diagnostic audit remain open.',
              '- **BBCR-006:** Partially implemented; explicit hostile-content boundaries exist, but full corpus and telemetry work remain open.':
              '- **BBCR-006:** Core trusted/untrusted payload separation, prompt hardening, caution telemetry, and deterministic hostile-input regressions are implemented and validated. Hidden-DOM and real OCR-image corpus coverage remains open.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one summary line: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/batch7-report-summary-fix.yml \
            .github/batch7-report-summary-fix-trigger.txt

      - name: Verify bounded final inventory
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'docs/BLIND_BROWSER_COMPREHENSIVE_CODE_REVIEW_FIX_IMPLEMENTATION_REPORT_2026-08-01.md',
              '.github/workflows/batch7-report-summary-fix.yml',
              '.github/batch7-report-summary-fix-trigger.txt',
          }
          paths = {line[3:] for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()}
          if paths != expected:
              raise SystemExit(f'final inventory mismatch: {sorted(paths)}')
          PY

      - name: Commit summary correction
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: align Batch 7 report summary'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:master

      - name: Record summary correction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh issue comment 5 --body "Batch 7 report summary synchronized in \`${SHA}\`; stale claims about missing typed remote types and missing telemetry were removed. A new owner-authored exact-final-SHA Permanent CI validation is still required."
