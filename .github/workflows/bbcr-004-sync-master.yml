name: BBCR-004 Sync With Master

on:
  pull_request:
    types:
      - edited
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: bbcr-004-sync-master
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/bbcr-004-origin-bound-credentials'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge the validated master evidence commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${GITHUB_HEAD_REF}" = "agent/bbcr-004-origin-bound-credentials"

          git config user.name "ekkus93"
          git config user.email "1386709+ekkus93@users.noreply.github.com"

          git fetch origin master
          test "$(git rev-parse origin/master)" = "7c3c4e49ee9a6c99fbf958ef17c92e4b1f9f5369"

          set +e
          git merge --no-commit --no-ff origin/master
          merge_status=$?
          set -e

          if [ "${merge_status}" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "${conflicts}" = "docs/BLIND_BROWSER_COMPREHENSIVE_CODE_REVIEW_FIX_IMPLEMENTATION_REPORT_2026-08-01.md"
            git checkout --ours -- docs/BLIND_BROWSER_COMPREHENSIVE_CODE_REVIEW_FIX_IMPLEMENTATION_REPORT_2026-08-01.md
            git add docs/BLIND_BROWSER_COMPREHENSIVE_CODE_REVIEW_FIX_IMPLEMENTATION_REPORT_2026-08-01.md
          fi

          test -z "$(git diff --name-only --diff-filter=U)"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/BLIND_BROWSER_COMPREHENSIVE_CODE_REVIEW_FIX_IMPLEMENTATION_REPORT_2026-08-01.md')
          text = path.read_text()

          replacements = [
              (
                  "**Post-merge evidence commit:** recorded by the commit containing the prior report update  \n"
                  "**Post-merge CI:** `30718904314`, job `91419258267` — success  \n"
                  "**Result:** implementation, bounded validation, PR validation, merge, harness cleanup, and permanent post-merge CI complete",
                  "**Post-merge evidence commit:** `c80ead4ef8f0e4df68f9a69b68bd3ce186328aec`<br>\n"
                  "**Post-merge CI run:** `30718904314`<br>\n"
                  "**Post-merge CI job:** `91419258267`<br>\n"
                  "**Result:** core implementation merged and fully validated; grounding-dependent follow-up remains open",
              ),
              (
                  "Validation completed before merge:",
                  "Validation evidence:",
              ),
              (
                  "- The temporary-harness cleanup base commit passed permanent `master` CI run `30718530934` before PR #3 was merged.",
                  "- The temporary-harness cleanup base commit passed permanent `master` CI run `30718530934` before PR #3 was merged.\n"
                  "- The exact post-merge evidence tree passed permanent `master` CI run `30718904314`, including formatting, compilation, Clippy, all Rust tests, frontend lint, UI tests, and the production frontend build.",
              ),
              (
                  "- **BBCR-002:** Core immutable confirmation-manifest implementation merged; DOM-generation and element revalidation dependencies remain open.",
                  "- **BBCR-002:** Core immutable confirmation-manifest implementation merged and fully validated; DOM-generation and element revalidation dependencies remain open.",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one report match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          rm .github/workflows/bbcr-004-sync-master.yml
          git add -A
          git diff --cached --check
          git commit -m "merge: sync BBCR-004 with validated master evidence"
          git push origin HEAD:agent/bbcr-004-origin-bound-credentials
