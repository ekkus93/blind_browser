name: Remote Data Consent Rust Test Diagnostic

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/remote-data-consent-rust-test-diagnostic.yml
      - .github/remote-data-consent-rust-test-diagnostic.trigger

permissions:
  contents: read
  statuses: write

concurrency:
  group: remote-data-consent-rust-test-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish diagnostic pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='ci/remote-data-consent-rust-test-diagnostic' \
            -f description='Remote data consent Rust-test diagnostic is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Ubuntu native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Run exact all-feature Rust tests with concise diagnostics
        shell: bash
        run: |
          set +e
          xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features > /tmp/remote-data-consent-rust-tests.log 2>&1
          status=$?
          set -e
          tail -n 300 /tmp/remote-data-consent-rust-tests.log
          exit "${status}"

      - name: Publish diagnostic conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if test "${JOB_STATUS}" = success; then
            state=success
            description='Remote data consent Rust-test diagnostic passed'
          else
            state=failure
            description='Remote data consent Rust-test diagnostic failed'
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='ci/remote-data-consent-rust-test-diagnostic' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
