name: CR3 P1.1 Materialize Repair Baseline

on:
  push:
    branches:
      - cr3-remote-speech-materialize
    paths:
      - .github/cr3-p1-1-v2.trigger

permissions:
  contents: write

jobs:
  materialize:
    if: "${{ github.event.head_commit.message == 'ci: materialize CR3 P1.1 repair baseline' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct exact bounded patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(cat .github/cr3-p1-1-v2.trigger)" = "cr3-remote-speech-materialize"
          find .github -maxdepth 1 -type f -name 'cr3-p1-1-v2.patch.gz.b64.part-*' -print | sort > /tmp/cr3-parts.txt
          test "$(wc -l < /tmp/cr3-parts.txt)" -eq 3
          mapfile -t parts < /tmp/cr3-parts.txt
          cat "${parts[@]}" > /tmp/cr3-p1-1-v2.patch.gz.b64
          echo "051143cbaafadfb04c4399eb8c90b8fba11c72262f8c5f5a305c08c6a3c33b0d  /tmp/cr3-p1-1-v2.patch.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/cr3-p1-1-v2.patch.gz.b64 > /tmp/cr3-p1-1-v2.patch.gz
          echo "8524f868dd393cfba6594e24718940f86184b82114b5ac062b0802f5bba19356  /tmp/cr3-p1-1-v2.patch.gz" | sha256sum --check --strict
          gzip --test /tmp/cr3-p1-1-v2.patch.gz
          gzip --decompress --stdout /tmp/cr3-p1-1-v2.patch.gz > /tmp/cr3-p1-1-v2.patch
          echo "53490333f1c8bb44491052f3ce336f4c7ac9844c6ec21edb899db050ec173f17  /tmp/cr3-p1-1-v2.patch" | sha256sum --check --strict
          git apply --check /tmp/cr3-p1-1-v2.patch
          git apply /tmp/cr3-p1-1-v2.patch

      - name: Set up Rust formatting
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply deterministic Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Remove temporary patch transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/cr3-p1-1-v2.patch.gz.b64.part-* \
                .github/cr3-p1-1-v2.trigger \
                .github/workflows/cr3-p1-1-remote-speech-consent-v2.yml
          git diff --check

      - name: Commit isolated repair baseline
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "wip: materialize remote speech consent repair baseline"
          git push origin HEAD:cr3-remote-speech-materialize
