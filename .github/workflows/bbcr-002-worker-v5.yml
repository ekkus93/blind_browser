name: BBCR-002 Worker V5

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: bbcr-002-worker-v5
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 3 &&
      github.event.comment.body == '/run-bbcr-002-v5' &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact BBCR-002 branch
        uses: actions/checkout@v4
        with:
          ref: agent/bbcr-002-confirmation-manifest
          fetch-depth: 0

      - name: Refuse unexpected branch revision
        id: branch_gate
        env:
          EXPECTED_SHA: 74b32f99da4381eacef885245183e93948de3d18
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Publish worker start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '# BBCR-002 worker v5'
            echo
            echo '- Status: in_progress'
            echo '- Input branch SHA: `74b32f99da4381eacef885245183e93948de3d18`'
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >"${RUNNER_TEMP}/status.md"
          gh issue edit 2 --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/status.md"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr

      - name: Apply contract and regression updates
        id: apply_updates
        run: |
          python3 .github/bbcr-002-finalize.py
          python3 .github/bbcr-002-transition-fix.py

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Rust
        id: format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Check silent-fallback policy
        id: silent_fallbacks
        run: bash scripts/check-silent-fallbacks.sh

      - name: Check default Rust configuration
        id: cargo_check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust clippy
        id: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings 2>&1 \
            | tee "${RUNNER_TEMP}/clippy.log"

      - name: Run Rust tests
        id: rust_tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Run frontend lint
        id: frontend_lint
        run: pnpm lint

      - name: Run UI tests
        id: ui_tests
        run: pnpm test:ui

      - name: Build frontend
        id: frontend_build
        run: pnpm build

      - name: Verify formatting and whitespace
        id: final_checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          git diff --check

      - name: Remove branch-only finalizers
        id: cleanup
        run: |
          rm .github/bbcr-002-finalize.py
          rm .github/bbcr-002-transition-fix.py
          rm .github/workflows/bbcr-002-apply.yml

      - name: Commit validated implementation
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: bind confirmations to immutable action manifests"
          git push origin HEAD:agent/bbcr-002-confirmation-manifest
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Publish worker result and diagnostics
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          BRANCH_GATE: ${{ steps.branch_gate.outcome }}
          APPLY_UPDATES: ${{ steps.apply_updates.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          SILENT_FALLBACKS: ${{ steps.silent_fallbacks.outcome }}
          CARGO_CHECK: ${{ steps.cargo_check.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          RUST_TESTS: ${{ steps.rust_tests.outcome }}
          FRONTEND_LINT: ${{ steps.frontend_lint.outcome }}
          UI_TESTS: ${{ steps.ui_tests.outcome }}
          FRONTEND_BUILD: ${{ steps.frontend_build.outcome }}
          FINAL_CHECKS: ${{ steps.final_checks.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          IMPLEMENTATION_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          {
            echo '# BBCR-002 worker v5'
            echo
            echo "- Status: ${JOB_STATUS}"
            echo '- Input branch SHA: `74b32f99da4381eacef885245183e93948de3d18`'
            echo "- Implementation SHA: \`${IMPLEMENTATION_SHA:-not-created}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '## Step outcomes'
            echo
            echo "- Branch gate: ${BRANCH_GATE}"
            echo "- Apply updates: ${APPLY_UPDATES}"
            echo "- Format: ${FORMAT}"
            echo "- Silent-fallback check: ${SILENT_FALLBACKS}"
            echo "- Cargo check: ${CARGO_CHECK}"
            echo "- Clippy: ${CLIPPY}"
            echo "- Rust tests: ${RUST_TESTS}"
            echo "- Frontend lint: ${FRONTEND_LINT}"
            echo "- UI tests: ${UI_TESTS}"
            echo "- Frontend build: ${FRONTEND_BUILD}"
            echo "- Final checks: ${FINAL_CHECKS}"
            echo "- Cleanup: ${CLEANUP}"
            echo "- Commit/push: ${COMMIT}"
            if [[ "${CLIPPY}" == 'failure' ]]; then
              echo
              echo '## Clippy diagnostic tail'
              echo
              echo '```text'
              tail -n 220 "${RUNNER_TEMP}/clippy.log" || true
              echo '```'
            fi
          } >"${RUNNER_TEMP}/status-final.md"
          gh issue edit 2 --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/status-final.md" || true
