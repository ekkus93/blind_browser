name: P1.4 follow-up closeout

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/p1-4-followup-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    if: "${{ github.event.head_commit.message == 'ci: stage P1.4 closure reconciliation' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile P1.3 and P1.4 follow-up closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 - <<'PY'
          from pathlib import Path

          todo_path = Path("docs/BB_CODE_REVIEW3_TODO.md")
          todo = todo_path.read_text()

          p13_start = todo.index("**Residual gap found but left out of scope**:")
          p13_end = todo.index("\n\n**Tests**:", p13_start)
          p13_replacement = '''**Residual OCR provenance follow-up closed (2026-08-13):** the
arbitrary `image_id` + `region_id` edge case is now fixed rather than left as
an open residual. `BrowserScreenshotState` records capture kind and the
capture-time document-space raster origin; viewport captures therefore retain
the scroll origin that was active when their pixels were produced, while
full-page and document-clip captures retain their own natural document origins.
`ImageCache` persists that provenance together with raster dimensions, and
`ResolvedScreenshotImage::ocr_bbox_for_document_bbox` translates a
document-absolute region bbox into image-relative coordinates only when the
requested rectangle is fully represented by that raster. Invalid provenance or
a region outside the cached raster fails closed with typed errors such as
`invalid_screenshot_provenance` / `ocr_bbox_outside_screenshot` instead of
OCRing unrelated pixels. Regression coverage exercises viewport, full-page, and
clip translation plus the out-of-raster rejection. The implementation landed in
`cd78bf5d9eb2c066d130966310c4a813c49a5388` and remains present in the current
green `master` tree.'''
          todo = todo[:p13_start] + p13_replacement + todo[p13_end:]

          p14_start = todo.index(
              "Also added `validate_planner_output_with_safety`\nas defense-in-depth was considered and explicitly deferred:"
          )
          p14_end = todo.index("\n\n**P1.4.3 addressed", p14_start)
          p14_replacement = '''The previously deferred execution-time
`validate_planner_output_with_safety` defense-in-depth follow-up is now also
closed (2026-08-13), without the false-positive empty-skill behavior that caused
it to be deferred originally. `PlanningStateSnapshot` now carries the
`active_skill_names` that were eligible when the exact planner output was
validated. The field is plan provenance, not mutable runtime state: fresh runtime
snapshots leave it empty, and `register_planning_snapshot` binds the planning-time
names to the output's SHA-256 digest at registration. Direct plans preserve the
skill set inside `ValidatedPlannerOutput`; remote and post-consent paths bind the
same `active_skill_names` already present in their trusted planner input.

At execution, `validate_and_consume_planning_snapshot` first performs the existing
digest/TTL/runtime-state checks and then reruns
`validate_planner_output_with_safety` using the snapshot-bound skill names and
snapshot-bound safety settings. Read-only outputs with no planning snapshot are
also structurally/policy validated, but receive no invented skill capability
(`active_skill_names = []`). `planner_available_tools()` is safe to recompute at
execution because it is a fixed registry filtered by the fixed
`is_plannable_tool` predicate, not mutable runtime state. Tests cover legitimate
bound skill use, forged/unknown skill rejection and digest drift, skill-free
read-only plans, and the fact that skill provenance is deliberately excluded from
runtime-state equality. Implementation SHA
`7b61a72b675086a737ad80560c29af15b088cddb`; exact clean-tree validation SHA
`66d975aa9d866b6a6d1bd9952a4e1e1e8fd5e2af` passed permanent CI run
`31730184347`, job `94548430293`, including strict all-target/all-feature Clippy
with `-D warnings`, the complete Rust/Wry suite, frontend lint/UI/build, and every
fallback/privacy scanner.'''
          todo = todo[:p14_start] + p14_replacement + todo[p14_end:]

          old_closure = "- P1.3-P1.4: `DONE`."
          new_closure = (
              "- P1.3-P1.4: `DONE`; the later P1.3 screenshot-provenance and P1.4 "
              "snapshot-bound skill revalidation follow-ups are also closed on current `master`."
          )
          if todo.count(old_closure) != 1:
              raise SystemExit("expected exactly one CR3 P1.3-P1.4 closure bullet")
          todo = todo.replace(old_closure, new_closure)
          todo_path.write_text(todo)

          memory_path = Path("memory.md")
          memory = memory_path.read_text()
          heading = "## 2026-08-13T18:57:52Z - ChatGPT GPT-5.6 Sol - P1.3/P1.4 follow-up hardening closed"
          if heading not in memory:
              entry = f'''{heading}

- Closed the P1.3 residual OCR coordinate-provenance edge case. Cached screenshots now retain their capture-time document-space raster origin and dimensions; `run_ocr(image_id, region_id)` translates document bboxes against that provenance and fails closed when the requested pixels are not actually present in the raster instead of OCRing an unrelated location. Implementation commit: `cd78bf5d9eb2c066d130966310c4a813c49a5388`.
- Closed the P1.4 execution-time safety-validation follow-up. `PlanningStateSnapshot` now binds planning-time `active_skill_names` to the exact planner-output digest; direct, remote, and remote-consent-resume paths preserve that eligibility; execution reruns `validate_planner_output_with_safety` using the bound skills and safety settings after snapshot freshness/provenance checks. Unbound read-only IPC outputs get structural/policy validation with no fabricated skill capability.
- P1.4 implementation SHA: `7b61a72b675086a737ad80560c29af15b088cddb`. Exact clean-tree validation SHA: `66d975aa9d866b6a6d1bd9952a4e1e1e8fd5e2af`. Permanent CI run `31730184347`, job `94548430293`: SUCCESS across fallback/privacy scanners, rustfmt, default cargo check, strict all-target/all-feature Clippy `-D warnings`, focused direct-command evidence, complete Rust/Wry tests, frontend lint/UI tests, and production build.

'''
              memory_path.write_text(entry + memory)
          PY

          rm .github/workflows/p1-4-followup-closeout.yml
          git diff --check

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .github/workflows/p1-4-followup-closeout.yml
            docs/BB_CODE_REVIEW3_TODO.md
            memory.md
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

          grep -Fq 'Residual OCR provenance follow-up closed (2026-08-13)' docs/BB_CODE_REVIEW3_TODO.md
          grep -Fq 'snapshot-bound skill revalidation follow-ups are also closed' docs/BB_CODE_REVIEW3_TODO.md
          grep -Fq '7b61a72b675086a737ad80560c29af15b088cddb' docs/BB_CODE_REVIEW3_TODO.md
          grep -Fq '31730184347' docs/BB_CODE_REVIEW3_TODO.md
          grep -Fq 'P1.3/P1.4 follow-up hardening closed' memory.md

      - name: Commit clean closure tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close P1.3 and P1.4 follow-up hardening'
          git push origin HEAD:master
