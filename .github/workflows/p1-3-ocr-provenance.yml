name: P1.3 OCR Screenshot Provenance

on:
  push:
    branches:
      - agent/p1-3-ocr-provenance

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-3-ocr-provenance
      - name: Materialize and inspect P1.3 source
        run: |
          python3 .github/p1-3-ocr-provenance.py
          python3 .github/p1-3-ocr-provenance-cleanup.py
          echo '--- matching lifecycle tests ---'
          grep -R -n -C 30 'preserves_lock_safe_cache_lifecycle_and_fail_closed_errors\|ocr_bbox_outside_screenshot' src-tauri/src/app_core || true
          echo '--- image_cache lines 720-810 ---'
          nl -ba src-tauri/src/app_core/image_cache.rs | sed -n '720,810p'
