name: P1.3 OCR Screenshot Provenance

on:
  push:
    branches:
      - agent/p1-3-ocr-provenance

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-3-ocr-provenance
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Materialize clean P1.3 source
        run: |
          python3 .github/p1-3-ocr-provenance.py
          python3 .github/p1-3-ocr-provenance-cleanup.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
          git add src-tauri/src/browser/config.rs \
            src-tauri/src/browser/page_inspection.rs \
            src-tauri/src/app_core/image_cache.rs \
            src-tauri/src/app_core/content_tools.rs \
            src-tauri/src/app_core/extraction_tools/ocr_tools.rs
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git commit -m "fix: bind OCR crops to screenshot provenance"
          git push origin HEAD:agent/p1-3-ocr-provenance
