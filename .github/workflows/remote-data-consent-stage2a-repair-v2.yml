name: Remote Data Consent Stage 2A Repair V2

on:
  push:
    branches:
      - master
    paths:
      - .github/remote-data-consent-stage2a-repair-v2.trigger

permissions:
  contents: write
  statuses: write

concurrency:
  group: remote-data-consent-stage2a-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish repair pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='ci/remote-data-consent-stage2a-repair-v2' \
            -f description='Remote data consent backend repair V2 is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install Ubuntu native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run exact Stage 2A repair and full validation matrix
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path(".github/remote-data-consent-stage2a-v2-run.sh")
          text = path.read_text()
          pattern = re.compile(
              r"if profile_helper_count == 0:\n"
              r".*?"
              r"    remote_planner_path\.write_text\(remote_planner\)\n",
              re.DOTALL,
          )
          replacement = r"""if profile_helper_count == 0:
              helper = '''impl crate::AppCore {
              /// Snapshot the configured remote planner profile under the `AppCore` lock so
              /// network preparation can run against an owned, immutable copy.
              pub(crate) fn remote_planner_profile_snapshot(
                  &self,
              ) -> Result<(String, crate::config::RemotePlannerProfile), ToolError> {
                  let Some(profile_name) = self.config.providers.planner.remote_profile.as_deref() else {
                      return Err(planner_interpretation_unavailable_error(
                          "planner_profile_unavailable",
                          "remote planner mode requires a configured planner profile",
                          false,
                          None,
                      ));
                  };
                  let Some(profile) = self.config.remote_planner_profiles.get(profile_name) else {
                      return Err(planner_interpretation_unavailable_error(
                          "planner_profile_unavailable",
                          format!("configured remote planner profile '{profile_name}' was not found"),
                          false,
                          None,
                      ));
                  };
                  Ok((profile_name.to_string(), profile.clone()))
              }
          }

          '''
              remote_planner_path.write_text(remote_planner.rstrip() + "\n\n" + helper)
          """
          text, count = pattern.subn(lambda _: replacement, text, count=1)
          if count != 1:
              raise SystemExit(
                  f"Stage 2A helper append repair: expected one marker-based block, found {count}"
              )

          sanitizer_anchor = "consent_path.write_text(consent)\n"
          sanitizer_count = text.count(sanitizer_anchor)
          if sanitizer_count != 1:
              raise SystemExit(
                  "Stage 2A sanitizer import repair: expected one consent write anchor, "
                  f"found {sanitizer_count}"
              )
          sanitizer_repair = '''stale_sanitizer_import = (
              "use crate::diagnostic_redaction::sanitize_url_for_display;\\n"
          )
          stale_sanitizer_import_count = consent.count(stale_sanitizer_import)
          if stale_sanitizer_import_count > 1:
              raise SystemExit(
                  "stale sanitizer import repair: expected at most one import, "
                  f"found {stale_sanitizer_import_count}"
              )
          if stale_sanitizer_import_count == 1:
              consent = consent.replace(stale_sanitizer_import, "", 1)

          consent_path.write_text(consent)
          '''
          text = text.replace(sanitizer_anchor, sanitizer_repair, 1)
          path.write_text(text)
          PY
          bash .github/remote-data-consent-stage2a-v2-run.sh

      - name: Publish repair conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if test "${JOB_STATUS}" = success; then
            state=success
            description='Remote data consent backend repair V2 passed'
          else
            state=failure
            description='Remote data consent backend repair V2 failed'
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='ci/remote-data-consent-stage2a-repair-v2' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
