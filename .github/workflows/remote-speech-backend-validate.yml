name: Remote Speech Backend Validate

on:
  push:
    branches:
      - remote-speech-capability-ralph
    paths:
      - .github/remote-speech-backend-validate.trigger

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out exact trigger SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct checksum-bound backend patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "13250b2dadd9b51b1077ee8916853994c458fbc0fd3555452391943f91ebe411  .github/remote-speech-backend-wip.patch.gz.b64" | sha256sum --check --strict
          base64 --decode .github/remote-speech-backend-wip.patch.gz.b64 > /tmp/remote-speech-backend.patch.gz
          echo "f2bc0375bafb76632664f63150121c9e015c2cec5ff54bfcf3afb9a20baa06c5  /tmp/remote-speech-backend.patch.gz" | sha256sum --check --strict
          gzip --test /tmp/remote-speech-backend.patch.gz
          gzip --decompress --stdout /tmp/remote-speech-backend.patch.gz > /tmp/remote-speech-backend.patch
          echo "283a374c55389066bc531a8c13529d584267cfd1c7120e729f1105542da55551  /tmp/remote-speech-backend.patch" | sha256sum --check --strict
          echo "6d233d7bc12c1c4d57695ca72e0ff940f8c7204798c1d35cd7ed7c7cd090f43c  .github/remote-speech-backend-supplement.patch" | sha256sum --check --strict
          git apply --check /tmp/remote-speech-backend.patch
          git apply /tmp/remote-speech-backend.patch
          git apply --check .github/remote-speech-backend-supplement.patch
          git apply .github/remote-speech-backend-supplement.patch
          test -f src-tauri/src/app_core/remote_data_consent/microphone_consent.rs

      - name: Install native dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential clang libclang-dev curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libleptonica-dev libtesseract-dev tesseract-ocr xvfb

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Format and capture hygiene result
        shell: bash
        run: |
          set +e
          cargo fmt --manifest-path src-tauri/Cargo.toml > /tmp/remote-speech-rustfmt.txt 2>&1
          fmt_status=$?
          if [ "$fmt_status" -eq 0 ]; then
            git diff --check > /tmp/remote-speech-hygiene.txt 2>&1
            hygiene_status=$?
          else
            hygiene_status=0
            : > /tmp/remote-speech-hygiene.txt
          fi
          set -e
          if [ "$fmt_status" -ne 0 ] || [ "$hygiene_status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/remote-speech-rustfmt.txt .github/remote-speech-rustfmt.txt
            cp /tmp/remote-speech-hygiene.txt .github/remote-speech-hygiene.txt
            printf 'rustfmt=%s\nhygiene=%s\n' "$fmt_status" "$hygiene_status" > .github/remote-speech-format-status.txt
            git add .github/remote-speech-rustfmt.txt .github/remote-speech-hygiene.txt .github/remote-speech-format-status.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: capture remote speech format diagnostic"
            git push origin HEAD:remote-speech-capability-ralph
            exit 1
          fi

      - name: Capture cargo check and strict Clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo check --manifest-path src-tauri/Cargo.toml > /tmp/remote-speech-cargo-check.txt 2>&1
          check_status=$?
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings > /tmp/remote-speech-clippy.txt 2>&1
          clippy_status=$?
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$check_status" -eq 0 ] && [ "$clippy_status" -eq 0 ]; then
            rm -f .github/remote-speech-backend-wip.patch.gz.b64 \
                  .github/remote-speech-backend-supplement.patch \
                  .github/remote-speech-backend-validate.trigger \
                  .github/workflows/remote-speech-backend-validate.yml \
                  .github/remote-speech-rustfmt.txt \
                  .github/remote-speech-hygiene.txt \
                  .github/remote-speech-format-status.txt \
                  .github/remote-speech-cargo-check.txt \
                  .github/remote-speech-clippy.txt \
                  .github/remote-speech-cargo-check.exit \
                  .github/remote-speech-clippy.exit \
                  .github/remote-speech-backend-status.txt
            git add -A
            git commit -m "wip: implement remote speech authorization backend"
            git push origin HEAD:remote-speech-capability-ralph
          else
            git reset --hard HEAD
            cp /tmp/remote-speech-cargo-check.txt .github/remote-speech-cargo-check.txt
            cp /tmp/remote-speech-clippy.txt .github/remote-speech-clippy.txt
            printf '%s\n' "$check_status" > .github/remote-speech-cargo-check.exit
            printf '%s\n' "$clippy_status" > .github/remote-speech-clippy.exit
            printf 'cargo_check=%s\nclippy=%s\n' "$check_status" "$clippy_status" > .github/remote-speech-backend-status.txt
            git add .github/remote-speech-cargo-check.txt .github/remote-speech-clippy.txt .github/remote-speech-cargo-check.exit .github/remote-speech-clippy.exit .github/remote-speech-backend-status.txt
            git commit -m "ci: capture remote speech backend diagnostics"
            git push origin HEAD:remote-speech-capability-ralph
            exit 1
          fi
