name: BBCR-002 Branch Worker

on:
  push:
    branches:
      - master

permissions:
  contents: write
  issues: write

concurrency:
  group: bbcr-002-branch-worker
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.event.head_commit.message == 'ci: rerun BBCR-002 branch finalizer' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact BBCR-002 branch
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: agent/bbcr-002-confirmation-manifest
          fetch-depth: 0

      - name: Refuse unexpected branch revision
        id: branch_gate
        env:
          EXPECTED_SHA: d81c8ff0ecf02bca923f2f930d39c8e9049675d1
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Publish worker start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat >"${RUNNER_TEMP}/status.md" <<EOF
          # BBCR-002 branch worker

          - **Status:** `in_progress`
          - **Branch SHA:** `$(git rev-parse HEAD)`
          - **Run:** [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF
          gh issue edit 2 --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/status.md"

      - name: Set up Rust
        id: rust_setup
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        id: pnpm_setup
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        id: node_setup
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install native dependencies
        id: native_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr

      - name: Apply contract and regression updates
        id: apply_updates
        run: python3 .github/bbcr-002-finalize.py

      - name: Install JavaScript dependencies
        id: js_dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Rust
        id: format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Check silent-fallback policy
        id: silent_fallbacks
        run: bash scripts/check-silent-fallbacks.sh

      - name: Check default Rust configuration
        id: cargo_check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust clippy
        id: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        id: rust_tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Run frontend lint
        id: frontend_lint
        run: pnpm lint

      - name: Run UI tests
        id: ui_tests
        run: pnpm test:ui

      - name: Build frontend
        id: frontend_build
        run: pnpm build

      - name: Verify formatting and whitespace
        id: final_checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          git diff --check

      - name: Remove branch-only finalizers
        id: cleanup
        run: |
          rm .github/bbcr-002-finalize.py
          rm .github/workflows/bbcr-002-apply.yml

      - name: Commit validated implementation
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: bind confirmations to immutable action manifests"
          git push origin HEAD:agent/bbcr-002-confirmation-manifest
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Publish worker result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          BRANCH_GATE: ${{ steps.branch_gate.outcome }}
          APPLY_UPDATES: ${{ steps.apply_updates.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          SILENT_FALLBACKS: ${{ steps.silent_fallbacks.outcome }}
          CARGO_CHECK: ${{ steps.cargo_check.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          RUST_TESTS: ${{ steps.rust_tests.outcome }}
          FRONTEND_LINT: ${{ steps.frontend_lint.outcome }}
          UI_TESTS: ${{ steps.ui_tests.outcome }}
          FRONTEND_BUILD: ${{ steps.frontend_build.outcome }}
          FINAL_CHECKS: ${{ steps.final_checks.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          IMPLEMENTATION_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          cat >"${RUNNER_TEMP}/status-final.md" <<EOF
          # BBCR-002 branch worker

          - **Status:** `${JOB_STATUS}`
          - **Input branch SHA:** `d81c8ff0ecf02bca923f2f930d39c8e9049675d1`
          - **Implementation SHA:** `${IMPLEMENTATION_SHA:-not-created}`
          - **Run:** [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          ## Step outcomes

          - Branch gate: `${BRANCH_GATE}`
          - Apply updates: `${APPLY_UPDATES}`
          - Format: `${FORMAT}`
          - Silent-fallback check: `${SILENT_FALLBACKS}`
          - Cargo check: `${CARGO_CHECK}`
          - Clippy: `${CLIPPY}`
          - Rust tests: `${RUST_TESTS}`
          - Frontend lint: `${FRONTEND_LINT}`
          - UI tests: `${UI_TESTS}`
          - Frontend build: `${FRONTEND_BUILD}`
          - Final checks: `${FINAL_CHECKS}`
          - Cleanup: `${CLEANUP}`
          - Commit/push: `${COMMIT}`
          EOF
          gh issue edit 2 --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/status-final.md"
