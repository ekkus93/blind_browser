name: Remote Data Consent Stage 2A V2 Guard Fix 2

on:
  push:
    branches:
      - master
    paths:
      - .github/remote-data-consent-stage2a-v2-guard-fix2.trigger

permissions:
  contents: write
  statuses: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='ci/remote-data-consent-stage2a-v2-guard-fix2' \
            -f description='Stage 2A V2 guard fix is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Replace brittle private-import guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/remote-data-consent-stage2a-repair-v2.yml')
          lines = path.read_text().splitlines(keepends=True)
          target = '              "src-tauri/src/commands/contracts/planner.rs",\n'
          hits = [i for i, line in enumerate(lines) if line == target]
          if len(hits) != 1:
              raise SystemExit(f'expected one planner-contracts repair target, found {len(hits)}')
          target_index = hits[0]
          start = target_index - 1
          if lines[start] != '          replace_exact(\n':
              raise SystemExit('planner-contracts repair does not start with replace_exact')
          end = None
          for index in range(target_index + 1, min(len(lines), target_index + 12)):
              if lines[index] == '          )\n':
                  end = index + 1
                  break
          if end is None:
              raise SystemExit('planner-contracts repair block end not found')
          replacement = '''          planner_contracts_path = Path("src-tauri/src/commands/contracts/planner.rs")
          planner_contracts = planner_contracts_path.read_text()
          private_import = "use crate::app_core::remote_data_consent::RemotePlannerConsentChallenge;\\n"
          private_import_count = planner_contracts.count(private_import)
          if private_import_count > 1:
              raise SystemExit(
                  f"duplicate private consent challenge import: expected at most one occurrence, found {private_import_count}"
              )
          if private_import_count == 1:
              planner_contracts_path.write_text(planner_contracts.replace(private_import, "", 1))
'''.splitlines(keepends=True)
          path.write_text(''.join(lines[:start] + replacement + lines[end:]))
          PY
          git diff --check

      - name: Publish patched workflow and self-clean
        shell: bash
        run: |
          rm -f .github/workflows/remote-data-consent-stage2a-v2-guard-fix.yml
          rm -f .github/remote-data-consent-stage2a-v2-guard-fix.trigger
          rm -f .github/workflows/remote-data-consent-stage2a-v2-guard-fix2.yml
          rm -f .github/remote-data-consent-stage2a-v2-guard-fix2.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "ci: make consent import repair idempotent"
          git push origin HEAD:master

      - name: Publish conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if test "${JOB_STATUS}" = success; then state=success; description='Stage 2A V2 guard fix passed'; else state=failure; description='Stage 2A V2 guard fix failed'; fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='ci/remote-data-consent-stage2a-v2-guard-fix2' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
