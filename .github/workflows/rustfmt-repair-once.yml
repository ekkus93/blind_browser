name: Rustfmt Repair Once

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: rustfmt-repair-once-master
  cancel-in-progress: false

jobs:
  repair:
    name: Apply exact rustfmt output
    if: >-
      ${{ github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the failed master revision
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Refuse a moved branch
        shell: bash
        env:
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          if [[ "${current_sha}" != "${FAILED_SHA}" ]]; then
            printf 'Master moved from failed SHA %s to %s; refusing stale repair.\n' \
              "${FAILED_SHA}" "${current_sha}"
            exit 0
          fi

      - name: Set up Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply and constrain formatter output
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml

          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 0 )); then
            printf 'No rustfmt changes are required.\n'
            exit 0
          fi

          allowed="$(cat <<'EOF'
src-tauri/src/app_core/model_management.rs
src-tauri/src/app_core/settings_adapters.rs
src-tauri/src/asr/remote.rs
src-tauri/src/config/persistence.rs
src-tauri/src/lib.rs
src-tauri/src/url_policy.rs
EOF
          )"

          for path in "${changed[@]}"; do
            if ! grep -Fxq -- "${path}" <<< "${allowed}"; then
              printf 'Refusing unexpected rustfmt change: %s\n' "${path}" >&2
              exit 1
            fi
          done

          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          git diff --check

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            printf 'Nothing to commit.\n'
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src-tauri/src/app_core/model_management.rs \
            src-tauri/src/app_core/settings_adapters.rs \
            src-tauri/src/asr/remote.rs \
            src-tauri/src/config/persistence.rs \
            src-tauri/src/lib.rs \
            src-tauri/src/url_policy.rs
          git commit -m "style: apply rustfmt"
          git push origin HEAD:master
