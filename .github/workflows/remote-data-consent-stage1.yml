name: Remote Data Consent Stage 1

on:
  push:
    branches:
      - master
    paths:
      - .github/remote-data-consent-stage1.trigger

permissions:
  contents: write
  statuses: write

concurrency:
  group: remote-data-consent-stage1
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish stage pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='ci/remote-data-consent-stage1' \
            -f description='Remote data consent stage 1 is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Ubuntu native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode transformation
        shell: bash
        run: |
          base64 -d .github/remote_data_stage1.py.gz.b64 | gzip -d > /tmp/remote_data_stage1.py
          python3 -m py_compile /tmp/remote_data_stage1.py

      - name: Apply versioned privacy policy foundation
        run: python3 /tmp/remote_data_stage1.py

      - name: Format transformed Rust tree
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Validate transformation scope
        shell: bash
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
          test -f src-tauri/src/app_core/remote_data_consent.rs
          grep -q 'RemotePlannerNetworkMode' src-tauri/src/config/types.rs
          grep -q 'evaluate_remote_data_policy' src-tauri/src/app_core/remote_data_consent.rs

      - name: Validate fallback and diagnostic policy
        run: |
          bash scripts/check-silent-fallbacks.sh
          python3 scripts/check-security-fallbacks.py --self-test
          python3 scripts/check-security-fallbacks.py
          python3 scripts/check-security-fallback-inventory.py --self-test
          python3 scripts/check-security-fallback-inventory.py
          python3 scripts/check-sensitive-diagnostics.py --self-test
          python3 scripts/check-sensitive-diagnostics.py

      - name: Check default Rust configuration
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run strict Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run complete Rust suite
        run: xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Run frontend lint
        run: pnpm lint

      - name: Run UI tests
        run: pnpm test:ui

      - name: Build frontend
        run: pnpm build

      - name: Publish cleaned foundation
        shell: bash
        run: |
          rm -f .github/workflows/remote-data-consent-stage1.yml
          rm -f .github/remote-data-consent-stage1.trigger
          rm -f .github/remote_data_stage1.py.gz.b64
          rm -f /tmp/remote_data_stage1.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          test ! -e .github/workflows/remote-data-consent-stage1.yml
          test ! -e .github/remote-data-consent-stage1.trigger
          test ! -e .github/remote_data_stage1.py.gz.b64
          git commit -m "feat: add versioned remote data privacy policy foundation"
          git push origin HEAD:master

      - name: Publish stage conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if test "${JOB_STATUS}" = success; then
            state=success
            description='Remote data consent stage 1 passed'
          else
            state=failure
            description='Remote data consent stage 1 failed'
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='ci/remote-data-consent-stage1' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
