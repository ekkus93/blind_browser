name: Patch Batch 7 V2 Worker

on:
  push:
    branches:
      - master
    paths:
      - .github/batch7-v2-worker-fix-trigger.txt

permissions:
  contents: write
  issues: write

concurrency:
  group: batch7-v2-worker-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Publish start marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 5 --body "Batch 7 V2 matcher patch started: head \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`."

      - name: Refuse unexpected repository state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          test -z "$(git branch --show-current)"
          test -f .github/workflows/batch7-privacy-boundary-v2.yml
          test -f .github/workflows/batch7-v2-worker-fix.yml
          test -f .github/batch7-v2-worker-fix-trigger.txt
          test -f scripts/patch-batch7-v2-worker.py

      - name: Patch and verify V2 worker
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-batch7-v2-worker.py
          git diff --check
          grep -F 'remote_import_pattern = re.compile(' .github/workflows/batch7-privacy-boundary-v2.yml
          ! grep -F 'old_remote_import =' .github/workflows/batch7-privacy-boundary-v2.yml

      - name: Remove patch machinery and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/patch-batch7-v2-worker.py
          rm .github/workflows/batch7-v2-worker-fix.yml
          rm .github/batch7-v2-worker-fix-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/batch7-privacy-boundary-v2.yml \
            scripts/patch-batch7-v2-worker.py \
            .github/workflows/batch7-v2-worker-fix.yml \
            .github/batch7-v2-worker-fix-trigger.txt
          git diff --cached --check
          git commit -m "ci: harden Batch 7 generated import matcher"
          patched_sha="$(git rev-parse HEAD)"
          git push origin HEAD:master
          gh issue comment 5 --body "Batch 7 V2 matcher patch completed: trigger head \`${GITHUB_SHA}\`, patched commit \`${patched_sha}\`, run \`${GITHUB_RUN_ID}\`."

      - name: Publish failure marker
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 5 --body "Batch 7 V2 matcher patch failed: head \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`."
