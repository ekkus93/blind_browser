name: Remote Data Consent Foundation Closeout

on:
  push:
    branches:
      - master
    paths:
      - .github/remote-data-consent-foundation-closeout.trigger

permissions:
  contents: write

concurrency:
  group: remote-data-consent-foundation-closeout
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile authoritative TODO
        shell: bash
        run: |
          python3 .github/remote-data-consent-foundation-closeout.py
          git diff --check
          grep -Fq '**Status:** In progress — Stage 1' docs/BLIND_BROWSER_REMOTE_DATA_CONSENT_ORIGIN_PRIVACY_TODO_2026-08-03.md
          grep -Fq '## 22A. Stage 1 foundation closeout' docs/BLIND_BROWSER_REMOTE_DATA_CONSENT_ORIGIN_PRIVACY_TODO_2026-08-03.md
          test -f docs/BLIND_BROWSER_REMOTE_DATA_CONSENT_ORIGIN_PRIVACY_IMPLEMENTATION_REPORT_2026-08-03.md
          test -f docs/BLIND_BROWSER_REMOTE_DATA_CONSENT_ORIGIN_PRIVACY_FOUNDATION_CLOSURE_2026-08-04.md

      - name: Publish clean documentation closeout
        shell: bash
        run: |
          rm -f .github/workflows/remote-data-consent-foundation-closeout.yml
          rm -f .github/remote-data-consent-foundation-closeout.py
          rm -f .github/remote-data-consent-foundation-closeout.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          test ! -e .github/workflows/remote-data-consent-foundation-closeout.yml
          test ! -e .github/remote-data-consent-foundation-closeout.py
          test ! -e .github/remote-data-consent-foundation-closeout.trigger
          git commit -m "docs: reconcile remote data privacy foundation"
          git push origin HEAD:master
