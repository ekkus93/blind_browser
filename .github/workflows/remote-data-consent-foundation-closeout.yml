## 3. Implemented architecture

### 3.1 Versioned privacy configuration

`RemotePlannerPrivacySettings` now has authoritative `network_mode`, `origin_rules`, `policy_schema_version`, and `migration_notice_pending` fields. Legacy consent, local-only, and blocked-origin fields remain readable only across the migration boundary and are synchronized from the new authoritative model after normalization.

The new-install default is `AskPerOrigin`.

### 3.2 Persistent origin decisions

Persistent blocks are origin-wide and carry no planner endpoint. Persistent allows require an exact normalized planner endpoint and the current remote-data policy version. Rule normalization uses the URL library, sorts deterministically, deduplicates exact semantic duplicates, and enforces a 256-rule maximum.

### 3.3 Legacy migration

Schema version zero maps as follows:

- legacy `local_only = true` → `LocalOnly`;
- legacy non-local with consent disabled → `AskPerOrigin`;
- legacy non-local with consent enabled → `AllowSanitizedNonHighRisk`;
- each legacy blocked origin → origin-wide persistent block.

Migration is idempotent and sets a bounded migration-notice flag. It does not manufacture destination-bound allows from legacy global consent.

### 3.4 Deterministic policy evaluator

The pure evaluator enforces this precedence:

1. loopback local service;
2. global local-only mode;
3. missing/opaque origin block;
4. high-risk context block;
5. persistent origin block;
6. exact unexpired session grant;
7. exact current-version persistent allow;
8. broad sanitized non-high-risk allow;
9. explicit consent required.

No default or fallback branch authorizes transmission.

### 3.5 Planner boundary integration

`sanitize_remote_planner_input` evaluates the deterministic privacy policy before constructing the serialized remote planner input. Network remote requests therefore cannot progress through the remote prompt boundary without an allowed decision. High-risk and blocked outcomes use bounded `remote_data_*` error codes.

The relevant runtime configuration fingerprint now includes the complete privacy settings object, so policy changes alter the runtime-state token used by existing planning-snapshot validation.

## 4. Changed files

