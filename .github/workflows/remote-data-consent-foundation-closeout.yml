name: Remote Data Consent Foundation Closeout

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/remote-data-consent-foundation-closeout.yml

permissions:
  contents: write

concurrency:
  group: remote-data-consent-foundation-closeout
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile bounded Stage 1 evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          todo_path = Path("docs/BLIND_BROWSER_REMOTE_DATA_CONSENT_ORIGIN_PRIVACY_TODO_2026-08-03.md")
          report_path = Path("docs/BLIND_BROWSER_REMOTE_DATA_CONSENT_ORIGIN_PRIVACY_IMPLEMENTATION_REPORT_2026-08-03.md")
          closure_path = Path("docs/BLIND_BROWSER_REMOTE_DATA_CONSENT_ORIGIN_PRIVACY_FOUNDATION_CLOSURE_2026-08-04.md")

          text = todo_path.read_text()
          old_status = "**Status:** Not started."
          new_status = (
