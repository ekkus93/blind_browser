## 8. Remaining milestone work

The following are deliberately not claimed complete:

- runtime-only once/session grant storage and concurrency-safe consumption;
- prepared-request-only network sender API;
- disclosure classes, counts, byte estimate, payload digest, and challenge manifest;
- runtime-only pending consent state;
- `ExecutionOutcome::NeedsRemoteDataConsent`;
- consent-response command, replay protection, persistence compensation, and exact resume;
- complete privacy invalidation matrix;
- typed runtime status and rule-management APIs;
- TypeScript contracts and safe frontend state;
- accessible just-in-time consent dialog;
- structured privacy settings and current-origin status UI;
- request-count, replay, expiry, concurrency, accessibility, and adversarial integration tests;
- full privacy/threat-model documentation and final BBCR reconciliation.

## 9. Recommended next stage

Implement the backend consent transaction boundary in this order:

1. runtime-only once/session grants;
2. `PreparedRemotePlannerRequest` and prepared-request-only network sending;
3. disclosure manifest and challenge digest;
4. bounded pending consent state;
5. `NeedsRemoteDataConsent` outcome;
6. consent-response command with exact validation, persistence, replay prevention, and unlocked network resume.

Frontend consent UX should begin only after those backend contracts and network request-count tests are stable.

## 10. Bounded statement

Stage 1 is complete and green. The complete remote-data consent and origin-privacy milestone is not complete, and the broader BBCR remediation program remains open.
