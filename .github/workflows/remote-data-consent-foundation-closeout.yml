- persistent allow destination and policy-version binding;
- session grant scope and expiry;
- ask-mode and unknown-origin fail-closed behavior;
- existing planner redaction, prompt-injection, direct-command safety, and frontend regression suites.

Permanent CI passed scanners, formatting, default compilation, strict all-target/all-feature Clippy, focused direct-command semantic evidence, all-feature Rust tests, frontend lint, UI tests, and production frontend build.

## 6. Failed intermediate evidence and repairs

### 6.1 Invalidated stage-runner evidence

The temporary Stage 1 runner initially used a diagnostic wrapper that read `$?` after the shell `if` compound command. That could convert a failed command into a successful wrapper result. The runner's apparent success was therefore invalidated and was never accepted as final evidence.

### 6.2 Strict-Clippy failure

Permanent CI run `30897812057`, job `91954789324`, failed strict Clippy because a test used `&[grant.clone()]`. Commit `14216226b223c092e1a4ff5da5b29c8129f67527` replaced it with `std::slice::from_ref(&grant)`.

### 6.3 Stale fixture failures

Permanent CI run `30898762353`, job `91957861759`, passed strict Clippy and then failed eight `planner_redaction` tests. The tests still configured legacy fields or expected obsolete `remote_planner_*` errors. A count-guarded repair migrated the fixtures to `network_mode`/`origin_rules` and canonical `remote_data_*` codes.

The guarded repair workflow passed in run `30900135542`, job `91962264055`, and published `158672218048f4482879232d7ffc0ea779e9bd07`.

