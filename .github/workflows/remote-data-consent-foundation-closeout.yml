No permanent workflow or diagnostic helper was added.

## 5. Test and validation coverage

Implemented tests cover:

- legacy migration idempotence and blocked-origin conversion;
- normalized/destination-bound allows and origin-wide blocks;
- origin rejection for path, credentials, query, and non-HTTP(S) input;
- loopback precedence;
