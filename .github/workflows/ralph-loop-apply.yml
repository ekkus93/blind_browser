name: Ralph Loop Apply

on:
  push:
    branches:
      - master

permissions:
  contents: write
  issues: write

concurrency:
  group: ralph-loop-apply-master
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ startsWith(github.event.head_commit.message, 'ralph:') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact trigger revision
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Refuse moved branch
        id: branch_gate
        shell: bash
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TRIGGER_SHA}"

      - name: Publish batch start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/ralph-loop-status.md"
          cat >"${body_file}" <<EOF
          <!-- maintained by the temporary Ralph Loop apply workflow -->
          # Ralph Loop batch status

          - **Status:** \`in_progress\`
          - **Trigger SHA:** \`${GITHUB_SHA}\`
          - **Run:** [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          - **Batch commit message:** \`$(cat .github/ralph-loop/commit_message.txt)\`
          - **Patch file:** \`.github/ralph-loop/current_patch.py\`

          The issue is overwritten by each bounded implementation batch.
          EOF
          gh issue edit 2 --repo "${GITHUB_REPOSITORY}" --body-file "${body_file}"

      - name: Set up Rust
        id: rust_setup
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install native dependencies
        id: native_dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Apply current bounded patch
        id: apply_patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ralph-loop/current_patch.py
          python3 .github/ralph-loop/fix_patch.py
          # GITHUB_TOKEN cannot publish workflow-file changes. Keep the validated
          # implementation batch separate; permanent CI is wired afterward via
          # the user-authorized GitHub connector and validated on that exact SHA.
          git restore --source=HEAD -- .github/workflows/ci.yml

      - name: Refuse changes outside current allowlist
        id: allowlist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 0 )); then
            echo "Patch produced no changes." >&2
            exit 1
          fi
          for path in "${changed[@]}"; do
            if ! grep -Fxq -- "${path}" .github/ralph-loop/allowed_paths.txt; then
              echo "Refusing unexpected changed path: ${path}" >&2
              exit 1
            fi
          done

      - name: Format Rust batch
        id: format
        shell: bash
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Verify Rust formatting
        id: format_check
        shell: bash
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check default Rust configuration
        id: cargo_check
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust clippy
        id: clippy
        shell: bash
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        id: tests
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          test_log="${RUNNER_TEMP}/rust-tests.log"
          : >"${test_log}"

          run_and_log() {
            "$@" 2>&1 | tee -a "${test_log}"
          }

          run_isolated_wry_test() {
            local index="$1"
            local test_name="$2"
            local case_log="${RUNNER_TEMP}/wry-test-${index}.log"

            echo "BEGIN isolated Wry test: ${test_name}" | tee -a "${test_log}"
            if ! xvfb-run -a cargo test \
              --manifest-path src-tauri/Cargo.toml \
              --all-features \
              --lib \
              "${test_name}" \
              -- \
              --ignored \
              --exact \
              --test-threads=1 \
              2>&1 | tee "${case_log}" | tee -a "${test_log}"; then
              echo "Isolated Wry test command failed: ${test_name}" | tee -a "${test_log}" >&2
              return 1
            fi

            if ! grep -Eq '^running 1 test\r?$' "${case_log}"; then
              echo "Isolated Wry invocation did not execute one test: ${test_name}" | tee -a "${test_log}" >&2
              return 1
            fi
            if ! grep -Fq "test result: ok. 1 passed; 0 failed; 0 ignored;" "${case_log}"; then
              echo "Isolated Wry invocation did not execute exactly one passing test: ${test_name}" | tee -a "${test_log}" >&2
              return 1
            fi
            echo "PASS isolated Wry test: ${test_name}" | tee -a "${test_log}"
          }

          run_and_log xvfb-run -a cargo test \
            --manifest-path src-tauri/Cargo.toml \
            --all-features

          run_isolated_wry_test 1 \
            app_core::tests::confirmation_replay_tests::app_core_confirmation_replay_and_runtime_state_binding_are_enforced
          run_isolated_wry_test 2 \
            app_core::tests::remote_privacy_api_tests::remote_privacy_status_reports_every_non_ephemeral_decision_and_stale_rules
          run_isolated_wry_test 3 \
            app_core::tests::remote_privacy_api_tests::remote_privacy_operations_fail_closed_without_unnecessary_persistence

      - name: Check patch whitespace
        id: diff_check
        shell: bash
        run: git diff --check

      - name: Commit validated batch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $(cat .github/ralph-loop/allowed_paths.txt)
          git commit -m "$(cat .github/ralph-loop/commit_message.txt)"
          git push origin HEAD:master
          echo "implementation_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Publish batch result
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_GATE_OUTCOME: ${{ steps.branch_gate.outcome }}
          RUST_SETUP_OUTCOME: ${{ steps.rust_setup.outcome }}
          NATIVE_DEPENDENCIES_OUTCOME: ${{ steps.native_dependencies.outcome }}
          APPLY_PATCH_OUTCOME: ${{ steps.apply_patch.outcome }}
          ALLOWLIST_OUTCOME: ${{ steps.allowlist.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          FORMAT_CHECK_OUTCOME: ${{ steps.format_check.outcome }}
          CARGO_CHECK_OUTCOME: ${{ steps.cargo_check.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          DIFF_CHECK_OUTCOME: ${{ steps.diff_check.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          IMPLEMENTATION_SHA: ${{ steps.commit.outputs.implementation_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/ralph-loop-status-final.md"
          observed_sha="${IMPLEMENTATION_SHA:-${GITHUB_SHA}}"
          test_summary="    No Rust test failure output was captured."
          if [[ -s "${RUNNER_TEMP}/rust-tests.log" && "${TESTS_OUTCOME}" == "failure" ]]; then
            summary_file="${RUNNER_TEMP}/rust-test-summary.txt"
            {
              grep -E '^(test .* FAILED|failures:|---- .* stdout ----|thread .* panicked|test result:|error: test failed|BEGIN isolated Wry test|PASS isolated Wry test|Isolated Wry)' \
                "${RUNNER_TEMP}/rust-tests.log" || true
              tail -n 160 "${RUNNER_TEMP}/rust-tests.log"
            } | tail -n 220 | sed 's/^/    /' >"${summary_file}"
            test_summary="$(cat "${summary_file}")"
          fi

          cat >"${body_file}" <<EOF
          <!-- maintained by the temporary Ralph Loop apply workflow -->
          # Ralph Loop batch status

          - **Status:** \`${JOB_STATUS}\`
          - **Trigger SHA:** \`${GITHUB_SHA}\`
          - **Observed implementation SHA:** \`${observed_sha}\`
          - **Run:** [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          - **Batch commit message:** \`$(cat .github/ralph-loop/commit_message.txt)\`

          ## Step outcomes

          - Branch gate: \`${BRANCH_GATE_OUTCOME}\`
          - Rust setup: \`${RUST_SETUP_OUTCOME}\`
          - Native dependencies: \`${NATIVE_DEPENDENCIES_OUTCOME}\`
          - Apply patch: \`${APPLY_PATCH_OUTCOME}\`
          - Allowlist: \`${ALLOWLIST_OUTCOME}\`
          - Format: \`${FORMAT_OUTCOME}\`
          - Format check: \`${FORMAT_CHECK_OUTCOME}\`
          - Cargo check: \`${CARGO_CHECK_OUTCOME}\`
          - Clippy: \`${CLIPPY_OUTCOME}\`
          - Tests: \`${TESTS_OUTCOME}\`
          - Diff check: \`${DIFF_CHECK_OUTCOME}\`
          - Commit/push: \`${COMMIT_OUTCOME}\`

          ## Rust test failure summary

          ${test_summary}

          This issue is overwritten by each bounded implementation batch and will be closed at final signoff.
          EOF
          gh issue edit 2 --repo "${GITHUB_REPOSITORY}" --body-file "${body_file}"
