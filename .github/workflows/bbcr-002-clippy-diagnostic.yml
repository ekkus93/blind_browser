name: BBCR-002 Clippy Diagnostic

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: bbcr-002-clippy-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 3 &&
      github.event.comment.body == '/diagnose-bbcr-002-clippy' &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@v4
        with:
          ref: agent/bbcr-002-confirmation-manifest
          fetch-depth: 0

      - name: Refuse unexpected branch revision
        env:
          EXPECTED_SHA: fe984b427d393707815f264d5a822f56bc003cec
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr

      - name: Apply branch finalization patches
        run: |
          python3 .github/bbcr-002-finalize.py
          python3 .github/bbcr-002-transition-fix.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Run Clippy with diagnostic capture
        id: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings 2>&1 \
            | tee "${RUNNER_TEMP}/clippy.log"

      - name: Publish exact diagnostic
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
        run: |
          {
            echo '# BBCR-002 Clippy diagnostic'
            echo
            echo '- Input branch SHA: `fe984b427d393707815f264d5a822f56bc003cec`'
            echo "- Clippy: \`${CLIPPY_OUTCOME}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '## Diagnostic tail'
            echo
            echo '```text'
            if [[ -s "${RUNNER_TEMP}/clippy.log" ]]; then
              tail -n 220 "${RUNNER_TEMP}/clippy.log"
            else
              echo 'No Clippy output was captured.'
            fi
            echo '```'
          } >"${RUNNER_TEMP}/diagnostic.md"
          gh issue edit 2 --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/diagnostic.md"
