name: One-time non-master branch cleanup

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  delete-non-master-branches:
    if: github.event.issue.title == '[automation] delete non-master branches'
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except master
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          deleted=()
          while IFS= read -r branch; do
            if [[ -z "$branch" || "$branch" == "master" ]]; then
              continue
            fi

            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            deleted+=("$branch")
          done < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
              --jq '.[].name'
          )

          if [[ ${#deleted[@]} -eq 0 ]]; then
            body='Branch cleanup completed. No non-master branches existed.'
          else
            printf -v joined '%s, ' "${deleted[@]}"
            joined="${joined%, }"
            body="Branch cleanup completed. Deleted: ${joined}. Preserved: master."
          fi

          gh issue comment "$ISSUE_NUMBER" --body "$body"
