name: Batch 8 Transform Diagnostic

on:
  push:
    branches:
      - agent/batch8-privacy-controls
    paths:
      - .github/batch8-diagnostic-trigger.txt

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Run transformation and publish exact diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python3 scripts/batch8-v2-apply.py >"${RUNNER_TEMP}/batch8-transform.log" 2>&1
          status=$?
          {
            printf 'Batch 8 transform diagnostic. Head: %s. Run: %s. Exit: %s.\n\n```text\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${status}"
            tail -c 50000 "${RUNNER_TEMP}/batch8-transform.log"
            printf '\n```\n'
          } >"${RUNNER_TEMP}/batch8-comment.md"
          gh issue comment 5 --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/batch8-comment.md"
          exit "${status}"
