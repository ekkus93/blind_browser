name: Batch 8 Default Cargo Diagnostic

on:
  push:
    branches:
      - agent/batch8-privacy-controls
    paths:
      - .github/batch8-diagnostic-trigger.txt

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr

      - name: Transform and capture exact default cargo check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/batch8-default-cargo.log"
          status=0

          {
            python3 scripts/batch8-v2-apply.py
            transform_status=$?
            if test "${transform_status}" -ne 0; then
              exit "${transform_status}"
            fi
            cargo fmt --manifest-path src-tauri/Cargo.toml --all
            cargo check --manifest-path src-tauri/Cargo.toml --locked
          } >"${log}" 2>&1 || status=$?

          {
            printf 'Batch 8 default cargo diagnostic. Head: %s. Run: %s. Exit: %s.\n\n```text\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${status}"
            tail -c 60000 "${log}"
            printf '\n```\n'
          } >"${RUNNER_TEMP}/batch8-comment.md"

          gh issue comment 5 --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/batch8-comment.md"
          exit "${status}"
