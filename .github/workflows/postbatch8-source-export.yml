name: Post-Batch-8 direct master publication

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: postbatch8-direct-master
  cancel-in-progress: false

jobs:
  apply-validate-export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact master commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require bounded patch inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/postbatch8-apply.patch.gz.b64.00
          test -f scripts/postbatch8-compile-fixes.py

      - name: Apply bounded product patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/postbatch8-apply.patch.gz.b64.* > /tmp/postbatch8.patch.gz.b64
          base64 --decode /tmp/postbatch8.patch.gz.b64 | gzip --decompress > /tmp/postbatch8.patch
          git apply --check /tmp/postbatch8.patch
          git apply /tmp/postbatch8.patch
          python3 scripts/postbatch8-compile-fixes.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Rust product changes
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Run security scanners
        run: |
          bash scripts/check-silent-fallbacks.sh
          python3 scripts/check-security-fallbacks.py --self-test
          python3 scripts/check-security-fallbacks.py
          python3 scripts/check-sensitive-diagnostics.py --self-test
          python3 scripts/check-sensitive-diagnostics.py

      - name: Validate Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Validate frontend
        run: |
          pnpm lint
          pnpm test:ui
          pnpm build

      - name: Remove publication scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/postbatch8-debug-source.yml
          rm -f .github/workflows/postbatch8-source-export.yml
          rm -f scripts/postbatch8-apply.patch.gz.b64.*
          rm -f scripts/postbatch8-compile-fixes.py

      - name: Stage and verify final product tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/postbatch8-debug-source.yml
          test ! -e .github/workflows/postbatch8-source-export.yml
          test ! -e scripts/postbatch8-apply.patch.gz.b64.00
          test ! -e scripts/postbatch8-compile-fixes.py
          git diff --cached --name-status

      - name: Package exact validated changes
        shell: bash
        run: |
          set -euo pipefail
          package=/tmp/postbatch8-package
          files=/tmp/postbatch8-files
          rm -rf "$package" "$files"
          mkdir -p "$package" "$files"
          printf '%s\n' "$GITHUB_SHA" > "$package/base-sha.txt"
          git diff --cached --name-status > "$package/name-status.txt"
          git diff --cached --name-only --diff-filter=D > "$package/deletions.txt"
          git diff --cached --binary > "$package/final.patch"
          while IFS= read -r -d '' path; do
            mkdir -p "$files/$(dirname "$path")"
            cp "$path" "$files/$path"
          done < <(git diff --cached --name-only --diff-filter=ACMRT -z)
          tar -C "$files" -czf "$package/final-files.tar.gz" .
          sha256sum "$package/final.patch" "$package/final-files.tar.gz" > "$package/SHA256SUMS"

      - name: Upload validated publication package
        uses: actions/upload-artifact@v4
        with:
          name: postbatch8-validated-master-publication
          path: /tmp/postbatch8-package
          if-no-files-found: error
          retention-days: 7
