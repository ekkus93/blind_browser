name: Post-Batch-8 direct master publication

on:
  push:
    branches: [master]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: postbatch8-direct-master
  cancel-in-progress: true

jobs:
  apply-validate-publish:
    if: github.event_name == 'push' || github.event.issue.title == 'Run post-Batch-8 direct master publication'
    runs-on: ubuntu-latest
    steps:
      - name: Report exact workflow run start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 6 --body "Direct-master post-Batch-8 publication run ${GITHUB_RUN_ID} started. Source master SHA: ${GITHUB_SHA}."

      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Require bounded patch inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/postbatch8-apply.patch.gz.b64.00
          test -f scripts/postbatch8-compile-fixes.py

      - name: Apply bounded product patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/postbatch8-apply.patch.gz.b64.* > /tmp/postbatch8.patch.gz.b64
          base64 --decode /tmp/postbatch8.patch.gz.b64 | gzip --decompress > /tmp/postbatch8.patch
          git apply --check /tmp/postbatch8.patch
          git apply /tmp/postbatch8.patch
          python3 scripts/postbatch8-compile-fixes.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Rust product changes
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Run security scanners
        run: |
          bash scripts/check-silent-fallbacks.sh
          python3 scripts/check-security-fallbacks.py --self-test
          python3 scripts/check-security-fallbacks.py
          python3 scripts/check-sensitive-diagnostics.py --self-test
          python3 scripts/check-sensitive-diagnostics.py

      - name: Validate Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Validate frontend
        run: |
          pnpm lint
          pnpm test:ui
          pnpm build

      - name: Remove publication scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/postbatch8-debug-source.yml
          rm -f .github/workflows/postbatch8-source-export.yml
          rm -f scripts/postbatch8-apply.patch.gz.b64.*
          rm -f scripts/postbatch8-compile-fixes.py

      - name: Stage and verify final product tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/postbatch8-debug-source.yml
          test ! -e .github/workflows/postbatch8-source-export.yml
          test ! -e scripts/postbatch8-apply.patch.gz.b64.00
          test ! -e scripts/postbatch8-compile-fixes.py
          git diff --cached --name-status

      - name: Commit and publish validated product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: complete post-Batch-8 hardening'
          git push origin HEAD:master

      - name: Report exact workflow run result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STATUS: ${{ job.status }}
        shell: bash
        run: |
          gh pr comment 6 --body "Direct-master post-Batch-8 publication run ${GITHUB_RUN_ID} completed with status: ${RUN_STATUS}. Source master SHA: ${GITHUB_SHA}."
