name: Post-Batch-8 bounded hardening

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: postbatch8-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Exit when bounded patch is absent
        id: patch
        shell: bash
        run: |
          if test -f scripts/postbatch8-apply.patch.gz.b64.00; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bounded product patch
        if: steps.patch.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/postbatch8-apply.patch.gz.b64.* > /tmp/postbatch8.patch.gz.b64
          base64 --decode /tmp/postbatch8.patch.gz.b64 | gzip --decompress > /tmp/postbatch8.patch
          git apply --check /tmp/postbatch8.patch
          git apply /tmp/postbatch8.patch
          python3 scripts/postbatch8-compile-fixes.py
          rm scripts/postbatch8-apply.patch.gz.b64.*
          rm scripts/postbatch8-compile-fixes.py

      - name: Set up Rust
        if: steps.patch.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        if: steps.patch.outputs.present == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: steps.patch.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install native dependencies
        if: steps.patch.outputs.present == 'true'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Install JavaScript dependencies
        if: steps.patch.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Format Rust product changes
        if: steps.patch.outputs.present == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Run security scanners
        if: steps.patch.outputs.present == 'true'
        run: |
          bash scripts/check-silent-fallbacks.sh
          python3 scripts/check-security-fallbacks.py --self-test
          python3 scripts/check-security-fallbacks.py
          python3 scripts/check-sensitive-diagnostics.py --self-test
          python3 scripts/check-sensitive-diagnostics.py

      - name: Validate Rust
        if: steps.patch.outputs.present == 'true'
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Validate frontend
        if: steps.patch.outputs.present == 'true'
        run: |
          pnpm lint
          pnpm test:ui
          pnpm build

      - name: Verify bounded tree
        if: steps.patch.outputs.present == 'true'
        run: |
          git diff --check
          test ! -e scripts/postbatch8-apply.patch.gz.b64.00
          test ! -e scripts/postbatch8-compile-fixes.py
          git status --short

      - name: Commit and push validated product changes
        if: steps.patch.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'security: complete post-batch8 hardening'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
