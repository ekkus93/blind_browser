name: Remote Data Consent Stage 2A Repair V3

on:
  push:
    branches:
      - master
    paths:
      - .github/remote-data-consent-stage2a-repair-v3.trigger

permissions:
  contents: write
  statuses: write

concurrency:
  group: remote-data-consent-stage2a-repair-v3
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish repair pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='ci/remote-data-consent-stage2a-repair-v3' \
            -f description='Remote data consent backend repair V3 is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install Ubuntu native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run explicit Stage 2A repair and complete validation
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('.github/remote-data-consent-stage2a-v2-run.sh')
          text = path.read_text()

          repair_block = re.compile(
              r"python3 - <<'PY'\nimport re\nfrom pathlib import Path\n.*?\nPY\n\ncargo fmt --manifest-path src-tauri/Cargo.toml --all",
              re.DOTALL,
          )
          text, repair_count = repair_block.subn(
              "python3 .github/remote-data-consent-stage2a-repair-v3.py\n"
              "python3 .github/remote-data-consent-stage2a-legacy-finalize.py\n"
              "python3 .github/remote-data-consent-stage2a-evidence-finalize.py\n\n"
              "cargo fmt --manifest-path src-tauri/Cargo.toml --all",
              text,
              count=1,
          )
          if repair_count != 1:
              raise SystemExit(
                  f'explicit Stage 2A repair insertion: expected one block, found {repair_count}'
              )

          shell_prelude = "set -euo pipefail\n\n"
          if text.count(shell_prelude) != 1:
              raise SystemExit(
                  'Stage 2A logged validation insertion: shell prelude mismatch'
              )
          logged_runner = '''set -euo pipefail

          run_logged() {
            local label="$1"
            shift
            local log="/tmp/remote-data-consent-stage2a-${label}.log"
            local status

            set +e
            "$@" >"${log}" 2>&1
            status=$?
            set -e

            if test "${status}" -ne 0; then
              echo "::error::${label} failed with exit ${status}"
              tail -n 300 "${log}" || true
              return "${status}"
            fi

            echo "${label} passed"
            tail -n 40 "${log}" || true
          }

          '''
          text = text.replace(shell_prelude, logged_runner, 1)

          validation_commands = {
              "cargo check --manifest-path src-tauri/Cargo.toml":
                  "run_logged cargo-check cargo check --manifest-path src-tauri/Cargo.toml",
              "cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings":
                  "run_logged cargo-clippy cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings",
              "xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features remote_data_consent -- --nocapture":
                  "run_logged focused-consent-tests xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features remote_data_consent -- --nocapture",
              "xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features":
                  "run_logged full-rust-tests xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features",
              "pnpm lint": "run_logged frontend-lint pnpm lint",
              "pnpm test:ui": "run_logged frontend-tests pnpm test:ui",
              "pnpm build": "run_logged frontend-build pnpm build",
          }
          had_trailing_newline = text.endswith("\n")
          lines = text.splitlines()
          for old, new in validation_commands.items():
              count = lines.count(old)
              if count != 1:
                  raise SystemExit(
                      f'Stage 2A logged validation insertion: expected one whole line {old!r}, found {count}'
                  )
              lines = [new if line == old else line for line in lines]
          text = "\n".join(lines) + ("\n" if had_trailing_newline else "")

          cleanup_anchor = "rm -f .github/remote-data-consent-stage2a-v2-run.sh\n"
          if text.count(cleanup_anchor) != 1:
              raise SystemExit('V3 cleanup insertion: runner cleanup anchor mismatch')
          text = text.replace(
              cleanup_anchor,
              "rm -f .github/workflows/remote-data-consent-stage2a-repair-v3.yml\n"
              "rm -f .github/remote-data-consent-stage2a-repair-v3.trigger\n"
              "rm -f .github/remote-data-consent-stage2a-repair-v3.py\n"
              "rm -f .github/remote-data-consent-stage2a-legacy-finalize.py\n"
              "rm -f .github/remote-data-consent-stage2a-evidence-finalize.py\n"
              + cleanup_anchor,
              1,
          )

          absence_anchor = "  .github/remote-data-consent-stage2a-v2-run.sh; do\n"
          if text.count(absence_anchor) != 1:
              raise SystemExit('V3 absence-check insertion: runner anchor mismatch')
          text = text.replace(
              absence_anchor,
              "  .github/workflows/remote-data-consent-stage2a-repair-v3.yml \\\n"
              "  .github/remote-data-consent-stage2a-repair-v3.trigger \\\n"
              "  .github/remote-data-consent-stage2a-repair-v3.py \\\n"
              "  .github/remote-data-consent-stage2a-legacy-finalize.py \\\n"
              "  .github/remote-data-consent-stage2a-evidence-finalize.py \\\n"
              + absence_anchor,
              1,
          )

          path.write_text(text)
          PY
          bash .github/remote-data-consent-stage2a-v2-run.sh

      - name: Publish repair conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if test "${JOB_STATUS}" = success; then
            state=success
            description='Remote data consent backend repair V3 passed'
          else
            state=failure
            description='Remote data consent backend repair V3 failed'
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='ci/remote-data-consent-stage2a-repair-v3' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
