name: CR3 Remote Speech Source Export

on:
  push:
    branches:
      - cr3-remote-speech-materialize
    paths:
      - .github/cr3-remote-speech-export.trigger

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/cr3-remote-speech-export.trigger)" = "export"
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=cr3-remote-speech-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: cr3-remote-speech-source-${{ github.sha }}
          path: cr3-remote-speech-source.zip
          if-no-files-found: error
          retention-days: 1
