name: Stage 2B Format Check

on:
  push:
    branches:
      - master
    paths:
      - .github/stage2b-format-check.trigger

permissions:
  contents: write

jobs:
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Format and compile Stage 2B tree
        id: check
        shell: bash
        run: |
          set -u
          cargo fmt --manifest-path src-tauri/Cargo.toml
          set +e
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets --all-features 2>&1 | tee /tmp/stage2b-cargo-check.log
          check_status=${PIPESTATUS[0]}
          set -e
          echo "check_status=${check_status}" >> "$GITHUB_OUTPUT"

      - name: Publish formatter output and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/stage2b-format-check.yml
          rm -f .github/stage2b-format-check.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/app_core/remote_privacy_api.rs
          git add src-tauri/src/command_handlers/safety_handlers.rs
          git add .github/workflows/stage2b-format-check.yml
          git add .github/stage2b-format-check.trigger
          if ! git diff --cached --quiet; then
            git commit -m "style: format Stage 2B privacy API"
            git push origin HEAD:master
          fi

      - name: Enforce compile result
        shell: bash
        run: exit "${{ steps.check.outputs.check_status }}"
