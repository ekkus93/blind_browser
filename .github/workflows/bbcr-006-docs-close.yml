name: BBCR-005 Documentation Closure

on:
  push:
    branches:
      - master
    paths:
      - .github/bbcr006-docs-trigger.txt

permissions:
  contents: write
  issues: write

concurrency:
  group: bbcr-005-documentation-closure
  cancel-in-progress: true

jobs:
  close-documentation:
    if: github.repository == 'ekkus93/blind_browser'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish observable run marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 5 --repo "${GITHUB_REPOSITORY}" --body "BBCR-005 documentation closure started: head \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`, job \`${GITHUB_JOB}\`."

      - name: Refuse unexpected repository state
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 7692336048a6edfba239b863af53fc857d3faca6 HEAD
          test -f scripts/bbcr006_close_docs.py
          test -f .github/workflows/bbcr-006-docs-close.yml
          test -f .github/bbcr006-docs-trigger.txt
          test -f src-tauri/src/app_core/image_cache.rs
          test ! -e scripts/bbcr006_apply.py
          test ! -e scripts/bbcr006_patch1.py
          test ! -e .github/workflows/bbcr-006-opaque-images.yml
          test ! -e .github/bbcr006-trigger.txt
          test "$(git status --porcelain)" = ""

      - name: Apply conservative checklist closure
        shell: bash
        run: |
          python3 scripts/bbcr006_close_docs.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          text = Path("docs/BLIND_BROWSER_COMPREHENSIVE_CODE_REVIEW_FIX_TODO_2026-08-01.md").read_text()
          start = text.index("## BBCR-005 —")
          end = text.index("## BBCR-006 —", start)
          block = text[start:end]
          required = [
              "- [x] Define an opaque image-handle type.",
              "- [x] Maintain an internal image registry.",
              "- [x] Canonicalize and verify containment.",
              "- [x] Harden screenshot file creation.",
              "- [x] Bind images to runtime context.",
              "- [x] Add cleanup policy.",
              "- [x] Reject symlink escape from the cache root.",
              "- [x] Cleanup removes files and registry entries without races.",
              "- [x] No planner-controlled string is converted directly into a local screenshot path.",
              "- [x] Canonical containment is enforced and tested on supported platforms.",
              "- [ ] Audit other filesystem-facing identifiers and paths.",
              "- [ ] Valid captured image handles still resolve and OCR correctly.",
              "7692336048a6edfba239b863af53fc857d3faca6",
              "30738218767",
              "91470773782",
          ]
          missing = [item for item in required if item not in block]
          if missing:
              raise SystemExit(f"BBCR-005 closure assertions missing: {missing}")
          PY

      - name: Publish exact failure diagnostic
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 5 --repo "${GITHUB_REPOSITORY}" --body "BBCR-005 documentation closure failed before commit: head \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`, job \`${GITHUB_JOB}\`."

      - name: Remove one-shot documentation machinery
        run: |
          rm scripts/bbcr006_close_docs.py
          rm .github/workflows/bbcr-006-docs-close.yml
          rm .github/bbcr006-docs-trigger.txt

      - name: Commit validated documentation to master
        id: publish
        shell: bash
        run: |
          git config user.name "ekkus93"
          git config user.email "1386709+ekkus93@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: close validated BBCR-005 scope"
          git push origin HEAD:master
          echo "commit_sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

      - name: Publish documentation closure marker
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_SHA: ${{ steps.publish.outputs.commit_sha }}
        run: |
          gh issue comment 5 --repo "${GITHUB_REPOSITORY}" --body "BBCR-005 documentation closure passed and was committed to master: trigger head \`${GITHUB_SHA}\`, docs commit \`${DOCS_SHA}\`, run \`${GITHUB_RUN_ID}\`, job \`${GITHUB_JOB}\`. The broad filesystem-identifier audit and real capture-to-Tesseract assertion remain open."
