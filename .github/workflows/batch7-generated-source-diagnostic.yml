name: Batch 7 Generated Source Diagnostic

on:
  push:
    branches:
      - master
    paths:
      - .github/batch7-generated-source-diagnostic-trigger.txt

permissions:
  contents: read
  issues: write

concurrency:
  group: batch7-generated-source-diagnostic
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refuse unexpected state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          test -f scripts/batch7-v3-apply.py

      - name: Generate and capture source shape
        shell: bash
        run: |
          set +e
          python3 scripts/batch7-v3-apply.py > /tmp/apply.log 2>&1
          apply_status=$?
          set -e
          {
            echo "apply_status=${apply_status}"
            echo "--- apply log ---"
            cat /tmp/apply.log
            echo "--- generated imports ---"
            sed -n '1,100p' src-tauri/src/app_core/remote_planner.rs
            echo "--- generated schema references ---"
            grep -n -E 'planner_output_schema|canonical_planner_output_examples|tool_input_schema|use crate::commands' src-tauri/src/app_core/remote_planner.rs || true
          } > /tmp/generated-source-shape.txt

      - name: Publish bounded source shape
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Batch 7 generated-source diagnostic: head \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`."
            echo
            echo '```text'
            tail -c 12000 /tmp/generated-source-shape.txt
            echo '```'
          } > /tmp/generated-source-comment.md
          gh issue comment 5 --body-file /tmp/generated-source-comment.md
