name: Remote Data Privacy Closure Frontend Diagnostic

on:
  push:
    branches:
      - master
    paths:
      - .github/remote-data-privacy-closure-frontend-diagnostic.trigger

permissions:
  contents: write

jobs:
  publish-validated-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reproduce and publish validated non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/remote-data-privacy-closure-origin-fix.yml"
          ).read_text(encoding="utf-8").splitlines()
          step_name = "      - name: Verify and apply bounded closure source"
          starts = [index for index, line in enumerate(workflow) if line == step_name]
          if len(starts) != 1:
              raise SystemExit("expected exactly one validated transformation step")
          run_indexes = [
              index
              for index in range(starts[0] + 1, len(workflow))
              if workflow[index] == "        run: |"
          ]
          if not run_indexes:
              raise SystemExit("validated transformation step has no run block")
          body = []
          for line in workflow[run_indexes[0] + 1 :]:
              if line.startswith("      - name: "):
                  break
              if line and not line.startswith("          "):
                  raise SystemExit(f"unexpected run-block indentation: {line!r}")
              body.append(line[10:] if line else "")
          if not body:
              raise SystemExit("validated transformation run block is empty")
          Path("/tmp/apply-validated-closure.sh").write_text(
              "\n".join(body) + "\n", encoding="utf-8"
          )
          PY

          bash /tmp/apply-validated-closure.sh

          python3 - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/ci.yml",
              "docs/BLIND_BROWSER_ACCEPTED_FALLBACKS_2026-08-02.md",
              "scripts/check-remote-planner-privacy-state.py",
              "scripts/run-rust-tests-linux.sh",
              "scripts/security-fallback-allowlist.txt",
              "scripts/security-fallback-inventory.json",
              "src-tauri/src/app_core/planner_redaction.rs",
              "src-tauri/src/app_core/remote_data_consent.rs",
              "src-tauri/src/app_core/tests/remote_data_consent_evidence_tests.rs",
              "src/remote-planner-consent-dialog-interactions.test.mjs",
              "src/remote-planner-consent-dialog-interactions.ts",
              "src/remote-planner-privacy-controller.test.mjs",
              "src/remote-planner-privacy-controller.ts",
              "src/remote-planner-privacy-ui.tsx",
          }
          modified = set(
              filter(
                  None,
                  subprocess.check_output(
                      ["git", "diff", "--name-only"], text=True
                  ).splitlines(),
              )
          )
          untracked = set(
              filter(
                  None,
                  subprocess.check_output(
                      ["git", "ls-files", "--others", "--exclude-standard"],
                      text=True,
                  ).splitlines(),
              )
          )
          actual = modified | untracked
          if actual != expected:
              raise SystemExit(
                  f"validated change-set drift: missing={sorted(expected - actual)!r} "
                  f"unexpected={sorted(actual - expected)!r}"
              )
          PY

          git restore -- .github/workflows/ci.yml
          git add -- \
            docs/BLIND_BROWSER_ACCEPTED_FALLBACKS_2026-08-02.md \
            scripts/check-remote-planner-privacy-state.py \
            scripts/run-rust-tests-linux.sh \
            scripts/security-fallback-allowlist.txt \
            scripts/security-fallback-inventory.json \
            src-tauri/src/app_core/planner_redaction.rs \
            src-tauri/src/app_core/remote_data_consent.rs \
            src-tauri/src/app_core/tests/remote_data_consent_evidence_tests.rs \
            src/remote-planner-consent-dialog-interactions.test.mjs \
            src/remote-planner-consent-dialog-interactions.ts \
            src/remote-planner-privacy-controller.test.mjs \
            src/remote-planner-privacy-controller.ts \
            src/remote-planner-privacy-ui.tsx

          python3 - <<'PY'
          import subprocess

          expected = {
              "docs/BLIND_BROWSER_ACCEPTED_FALLBACKS_2026-08-02.md",
              "scripts/check-remote-planner-privacy-state.py",
              "scripts/run-rust-tests-linux.sh",
              "scripts/security-fallback-allowlist.txt",
              "scripts/security-fallback-inventory.json",
              "src-tauri/src/app_core/planner_redaction.rs",
              "src-tauri/src/app_core/remote_data_consent.rs",
              "src-tauri/src/app_core/tests/remote_data_consent_evidence_tests.rs",
              "src/remote-planner-consent-dialog-interactions.test.mjs",
              "src/remote-planner-consent-dialog-interactions.ts",
              "src/remote-planner-privacy-controller.test.mjs",
              "src/remote-planner-privacy-controller.ts",
              "src/remote-planner-privacy-ui.tsx",
          }
          actual = set(
              filter(
                  None,
                  subprocess.check_output(
                      ["git", "diff", "--cached", "--name-only"], text=True
                  ).splitlines(),
              )
          )
          if actual != expected:
              raise SystemExit(
                  f"publication staging drift: missing={sorted(expected - actual)!r} "
                  f"unexpected={sorted(actual - expected)!r}"
              )
          if any(path.startswith(".github/workflows/") for path in actual):
              raise SystemExit("workflow change entered Actions-token publication commit")
          PY

          git diff --cached --check
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git commit -m "test: close remote data privacy evidence gaps"
          git push origin HEAD:master
