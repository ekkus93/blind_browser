name: Remote Data Privacy Closure Frontend Diagnostic

on:
  push:
    branches:
      - master
    paths:
      - .github/remote-data-privacy-closure-frontend-diagnostic.trigger

permissions:
  contents: read

jobs:
  validate-generated-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply checksum-pinned closure patch and typed import repair
        shell: bash
        run: |
          set -euo pipefail
          parts=(.github/remote-data-privacy-closure-batch1.patch.gz.b64.part-??)
          test "${#parts[@]}" -eq 6
          cat "${parts[@]}" > /tmp/closure.patch.gz.b64
          echo "38fe67435dc1305b2a526d598415e5f25fccc9ba51d1375e07661577d0296a7b  /tmp/closure.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/closure.patch.gz.b64 > /tmp/closure.patch.gz
          gzip -t /tmp/closure.patch.gz
          gzip -dc /tmp/closure.patch.gz > /tmp/closure.patch
          echo "e465efe86d24f1ba26ef359593e5c124afc40ded0f0f17da29af69ff8825399d  /tmp/closure.patch" | sha256sum -c -
          git apply --check /tmp/closure.patch
          git apply /tmp/closure.patch
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/remote-planner-privacy-ui.tsx")
          text = path.read_text(encoding="utf-8")
          anchor = '} from "react";\n\n'
          replacement = '''} from "react";

import {
  activateConsentDialogFocus,
  handleConsentDialogKeyboard,
} from "./remote-planner-consent-dialog-interactions.ts";

'''
          if text.count(anchor) != 1:
              raise SystemExit("expected exactly one React import boundary")
          path.write_text(text.replace(anchor, replacement), encoding="utf-8")
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frontend
        run: |
          pnpm lint
          pnpm test:ui
          pnpm build
