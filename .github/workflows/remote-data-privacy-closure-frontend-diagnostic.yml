name: Remote Data Privacy Closure Frontend Diagnostic

on:
  push:
    branches:
      - master
    paths:
      - .github/remote-data-privacy-closure-frontend-diagnostic.trigger

permissions:
  contents: read

jobs:
  inspect-permanent-workflow-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reproduce validated transformation and print CI diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/remote-data-privacy-closure-origin-fix.yml"
          ).read_text(encoding="utf-8").splitlines()
          step_name = "      - name: Verify and apply bounded closure source"
          starts = [index for index, line in enumerate(workflow) if line == step_name]
          if len(starts) != 1:
              raise SystemExit("expected exactly one validated transformation step")
          run_indexes = [
              index
              for index in range(starts[0] + 1, len(workflow))
              if workflow[index] == "        run: |"
          ]
          if not run_indexes:
              raise SystemExit("validated transformation step has no run block")
          body = []
          for line in workflow[run_indexes[0] + 1 :]:
              if line.startswith("      - name: "):
                  break
              if line and not line.startswith("          "):
                  raise SystemExit(f"unexpected run-block indentation: {line!r}")
              body.append(line[10:] if line else "")
          if not body:
              raise SystemExit("validated transformation run block is empty")
          Path("/tmp/apply-validated-closure.sh").write_text(
              "\n".join(body) + "\n", encoding="utf-8"
          )
          PY
          bash /tmp/apply-validated-closure.sh
          echo 'BEGIN permanent CI workflow diff'
          git diff -- .github/workflows/ci.yml
          echo 'END permanent CI workflow diff'
