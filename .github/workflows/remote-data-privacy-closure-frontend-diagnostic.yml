name: Remote Data Privacy Closure Frontend Diagnostic

on:
  push:
    branches:
      - master
    paths:
      - .github/remote-data-privacy-closure-frontend-diagnostic.trigger

permissions:
  contents: write

jobs:
  wire-validated-frontend-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update bounded publishing workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/remote-data-privacy-closure-origin-fix.yml")
          text = path.read_text(encoding="utf-8")

          frontend_anchor = (
              '          redaction_path = Path("src-tauri/src/app_core/planner_redaction.rs")\n'
          )
          frontend_insert = (
              '          frontend_path = Path("src/remote-planner-privacy-ui.tsx")\n'
              '          frontend_text = frontend_path.read_text(encoding="utf-8")\n'
              '          frontend_anchor = \'} from "react";\\n\\n\'\n'
              '          frontend_import = (\n'
              '              \'} from "react";\\n\\n\'\n'
              '              \'import {\\n\'\n'
              '              \'  activateConsentDialogFocus,\\n\'\n'
              '              \'  handleConsentDialogKeyboard,\\n\'\n'
              '              \'} from "./remote-planner-consent-dialog-interactions.ts";\\n\\n\'\n'
              '          )\n'
              '          if frontend_text.count(frontend_anchor) != 1:\n'
              '              raise SystemExit(\n'
              '                  "expected exactly one React import boundary for consent helper repair"\n'
              '              )\n'
              '          frontend_path.write_text(\n'
              '              frontend_text.replace(frontend_anchor, frontend_import),\n'
              '              encoding="utf-8",\n'
              '          )\n\n'
              '          redaction_path = Path("src-tauri/src/app_core/planner_redaction.rs")\n'
          )
          if text.count(frontend_anchor) != 1:
              raise SystemExit("expected exactly one frontend transform insertion point")
          text = text.replace(frontend_anchor, frontend_insert)

          cleanup_anchor = (
              '            .github/workflows/remote-data-privacy-closure-origin-fix.yml \\\n'
              '            .github/remote-data-privacy-closure-origin-fix.trigger \\\n'
          )
          cleanup_replacement = (
              '            .github/workflows/remote-data-privacy-closure-origin-fix.yml \\\n'
              '            .github/remote-data-privacy-closure-origin-fix.trigger \\\n'
              '            .github/workflows/remote-data-privacy-closure-frontend-diagnostic.yml \\\n'
              '            .github/remote-data-privacy-closure-frontend-diagnostic.trigger \\\n'
          )
          if text.count(cleanup_anchor) != 1:
              raise SystemExit("expected exactly one bounded cleanup insertion point")
          text = text.replace(cleanup_anchor, cleanup_replacement)

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add .github/workflows/remote-data-privacy-closure-origin-fix.yml
          git diff --cached --check
          git commit -m "ci: wire typed frontend closure repair"
          git push origin HEAD:master
