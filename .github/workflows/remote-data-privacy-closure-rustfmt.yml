name: Remote Data Privacy Closure Rustfmt Repair

on:
  push:
    branches:
      - master
    paths:
      - .github/remote-data-privacy-closure-rustfmt.trigger

permissions:
  contents: write

jobs:
  format-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust formatting
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply deterministic Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml

          python3 - <<'PY'
          import subprocess

          expected = {
              "src-tauri/src/app_core/remote_data_consent.rs",
              "src-tauri/src/app_core/tests/remote_data_consent_evidence_tests.rs",
          }
          actual = set(
              filter(
                  None,
                  subprocess.check_output(
                      ["git", "diff", "--name-only"], text=True
                  ).splitlines(),
              )
          )
          if actual != expected:
              raise SystemExit(
                  f"rustfmt change-set drift: missing={sorted(expected - actual)!r} "
                  f"unexpected={sorted(actual - expected)!r}"
              )
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          git diff --check
          git add -- \
            src-tauri/src/app_core/remote_data_consent.rs \
            src-tauri/src/app_core/tests/remote_data_consent_evidence_tests.rs

          python3 - <<'PY'
          import subprocess

          expected = {
              "src-tauri/src/app_core/remote_data_consent.rs",
              "src-tauri/src/app_core/tests/remote_data_consent_evidence_tests.rs",
          }
          actual = set(
              filter(
                  None,
                  subprocess.check_output(
                      ["git", "diff", "--cached", "--name-only"], text=True
                  ).splitlines(),
              )
          )
          if actual != expected:
              raise SystemExit(
                  f"rustfmt staging drift: missing={sorted(expected - actual)!r} "
                  f"unexpected={sorted(actual - expected)!r}"
              )
          PY

          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git commit -m "style: apply remote privacy closure rustfmt"
          git push origin HEAD:master
