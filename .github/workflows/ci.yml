name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write
  issues: write
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish permanent CI pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='ci/permanent' \
            -f description='Permanent CI is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Ubuntu native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for reintroduced silent-fallback patterns
        run: bash scripts/check-silent-fallbacks.sh

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Check default feature configuration
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Run frontend lint
        run: pnpm lint

      - name: Run UI tests
        run: pnpm test:ui

      - name: Build frontend
        run: pnpm build

      - name: Publish permanent CI conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if test "${JOB_STATUS}" = success; then
            state=success
            description='Permanent CI passed'
          else
            state=failure
            description='Permanent CI failed'
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='ci/permanent' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  close-batch5-documentation:
    if: github.event_name == 'push' && github.event.head_commit.message == 'ci(bbcr-015): execute Batch 5 documentation closure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact finalizer head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish observable finalizer marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 5 --repo "${GITHUB_REPOSITORY}" --body "BBCR-005 documentation finalizer started: head \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`, job \`${GITHUB_JOB}\`."

      - name: Apply conservative closure
        shell: bash
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f scripts/bbcr005_docs_close.py
          test -f .github/workflows/bbcr005-docs-close.yml
          test -f .github/bbcr005-docs-trigger.txt
          test -f docs/BBCR-005_RUNTIME_STATE_BINDING_2026-08-01.md
          test "$(git status --porcelain)" = ""
          python3 scripts/bbcr005_docs_close.py 2>&1 | tee "${RUNNER_TEMP}/bbcr005-docs.log"
          grep -Fq '**Validated source commit:** `1a6c2b213777766d9e1de056127cafcf0ca45bfa`' docs/BLIND_BROWSER_COMPREHENSIVE_CODE_REVIEW_FIX_TODO_2026-08-01.md
          grep -Fq '## Batch 5 — Runtime-bound planning, click authorization, and confirmation replay defense' docs/BLIND_BROWSER_COMPREHENSIVE_CODE_REVIEW_FIX_IMPLEMENTATION_REPORT_2026-08-01.md
          grep -Fq 'A complete audit of direct non-planner side-effect entry points remains open.' docs/BLIND_BROWSER_COMPREHENSIVE_CODE_REVIEW_FIX_IMPLEMENTATION_REPORT_2026-08-01.md
          git diff --check

      - name: Restore permanent workflow and remove one-shot files
        run: |
          git show e9e9e5644e7874ab72bb16483b5ad3ccedc0ccfd:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm scripts/bbcr005_docs_close.py
          rm .github/workflows/bbcr005-docs-close.yml
          rm .github/bbcr005-docs-trigger.txt

      - name: Commit documentation closure
        id: publish
        shell: bash
        run: |
          git config user.name "ekkus93"
          git config user.email "1386709+ekkus93@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: record Batch 5 bounded validation"
          git push origin HEAD:master
          echo "commit_sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

      - name: Publish finalizer success
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_SHA: ${{ steps.publish.outputs.commit_sha }}
        run: |
          gh issue comment 5 --repo "${GITHUB_REPOSITORY}" --body "BBCR-005 documentation closure committed to master: finalizer head \`${GITHUB_SHA}\`, documentation commit \`${DOCS_SHA}\`, run \`${GITHUB_RUN_ID}\`, job \`${GITHUB_JOB}\`. Final Batch 5 declaration still requires permanent CI on an owner-authored exact final SHA."

      - name: Publish finalizer failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          diagnostic='BBCR-005 documentation finalizer failed before commit.'
          if test -s "${RUNNER_TEMP}/bbcr005-docs.log"; then
            diagnostic="$(tail -n 80 "${RUNNER_TEMP}/bbcr005-docs.log")"
          fi
          gh issue comment 5 --repo "${GITHUB_REPOSITORY}" --body "BBCR-005 documentation finalizer failed: head \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`, job \`${GITHUB_JOB}\`. Diagnostic:\n\n\`\`\`text\n${diagnostic}\n\`\`\`"
