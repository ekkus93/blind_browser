name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Finalize P1.4 tracker reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/BB_CODE_REVIEW3_TODO.md")
          text = path.read_text()
          old = """Also added `validate_planner_output_with_safety`
as defense-in-depth was considered and explicitly deferred: doing it
correctly needs `active_skill_names` re-derived at execute time (the check
validates `planner_output.selected_skills` against what was active when
planned), which `PlanningStateSnapshot` doesn't currently carry — adding it
naively with an empty list would false-positive-reject any legitimate
snapshot-bound plan that uses skills. Threading `active_skill_names` through
the snapshot properly is a reasonable follow-up, not required to close the
verified gap."""
          new = """The previously deferred `validate_planner_output_with_safety`
defense-in-depth follow-up is now closed. `PlanningStateSnapshot` carries the
planning-time `active_skill_names` as plan provenance, and
`register_planning_snapshot` binds those names to the exact planner-output
digest. Direct plans preserve the validated skill set inside
`ValidatedPlannerOutput`; remote plans and remote-consent resumes bind the same
skill set already present in their trusted planner input. At execution,
`validate_and_consume_planning_snapshot` reruns
`validate_planner_output_with_safety` using the snapshot-bound skills and safety
settings after digest, expiry, and runtime-state validation. Unbound read-only
outputs are still structurally/policy validated but receive no fabricated skill
capability. Regression coverage verifies legitimate bound skills, forged or
altered skill rejection, digest drift, and skill-free read-only plans.

Implementation SHA: `7b61a72b675086a737ad80560c29af15b088cddb`.
Exact clean-tree validation SHA: `66d975aa9d866b6a6d1bd9952a4e1e1e8fd5e2af`.
Permanent CI run `31730184347`, job `94548430293`: SUCCESS across strict
all-target/all-feature Clippy with `-D warnings`, the complete Rust/Wry suite,
frontend lint/UI/build, and the fallback/privacy/security scanners."""
          if text.count(old) != 1:
              raise SystemExit("expected the stale P1.4 paragraph exactly once")
          path.write_text(text.replace(old, new))
          PY

          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/ci.yml\ndocs/BB_CODE_REVIEW3_TODO.md'
          grep -Fq 'The previously deferred `validate_planner_output_with_safety`' docs/BB_CODE_REVIEW3_TODO.md
          grep -Fq '31730184347' docs/BB_CODE_REVIEW3_TODO.md
          ! grep -Fq 'as defense-in-depth was considered and explicitly deferred' docs/BB_CODE_REVIEW3_TODO.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: reconcile P1.4 execution safety closure'
          git push origin HEAD:master

      - name: Publish permanent CI pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='ci/permanent' \
            -f description='Permanent CI is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Ubuntu native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for reintroduced silent-fallback patterns
        run: bash scripts/check-silent-fallbacks.sh

      - name: Check reviewed security fallbacks
        run: |
          python3 scripts/check-security-fallbacks.py --self-test
          python3 scripts/check-security-fallbacks.py

      - name: Check exact accepted-fallback inventory
        run: |
          python3 scripts/check-security-fallback-inventory.py --self-test
          python3 scripts/check-security-fallback-inventory.py

      - name: Check for sensitive diagnostics
        run: |
          python3 scripts/check-sensitive-diagnostics.py --self-test
          python3 scripts/check-sensitive-diagnostics.py

      - name: Check remote planner privacy state boundaries
        run: |
          python3 scripts/check-remote-planner-privacy-state.py --self-test
          python3 scripts/check-remote-planner-privacy-state.py

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Check default feature configuration
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run focused direct-command semantic evidence
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --test post_batch8_direct_command_policy_evidence

      - name: Run Rust tests
        run: bash scripts/run-rust-tests-linux.sh

      - name: Run frontend lint
        run: pnpm lint

      - name: Run UI tests
        run: pnpm test:ui

      - name: Build frontend
        run: pnpm build

      - name: Publish permanent CI conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if test "${JOB_STATUS}" = success; then
            state=success
            description='Permanent CI passed'
          else
            state=failure
            description='Permanent CI failed'
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='ci/permanent' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
