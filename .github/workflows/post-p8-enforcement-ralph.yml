name: Post-P8 Enforcement Ralph

on:
  push:
    branches:
      - master
    paths:
      - '.github/post_p8_enforcement_patch.py'
      - '.github/post_p8_enforcement_repair.py'
      - '.github/workflows/post-p8-enforcement-ralph.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: post-p8-enforcement-ralph
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish patch pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='ci/post-p8-enforcement-ralph' \
            -f description='Post-P8 enforcement Ralph validation is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare and apply bounded patch
        run: |
          python3 .github/post_p8_enforcement_repair.py --prepare
          python3 .github/post_p8_enforcement_patch.py
          python3 .github/post_p8_enforcement_repair.py --repair
          python3 - <<'PY'
          from pathlib import Path

          evidence = Path('src-tauri/src/app_core/tests/direct_command_evidence_tests.rs')
          if not evidence.is_file():
              raise SystemExit(f'missing generated evidence test: {evidence}')

          evidence_source = evidence.read_text(encoding='utf-8')
          old_page_context_evidence = '''    let page_context_resolver_sources = [
        &dispatch_source,
        &executor_source,
        &validator_source,
        &field_focus_source,
    ];
    for command in [
        DirectCommandName::ClickElementV2,
        DirectCommandName::FillForm,
        DirectCommandName::SubmitForm,
        DirectCommandName::ReportFocusedField,
    ] {
        let policy = direct_command_policy(command);
        assert_eq!(
            policy.page_context,
            DirectCommandPageContextPolicy::SanitizedSnapshot,
            "{}: page-context commands must require a sanitized snapshot",
            command.as_str()
        );
        assert!(
            page_context_resolver_sources
                .iter()
                .all(|source| source.contains("redact_page_snapshot_for_remote")),
            "{}: page-context resolver sources must retain the reviewed sanitization helper",
            command.as_str()
        );
    }
'''
          new_page_context_evidence = '''    // Sanitization belongs to the command-resolution boundary. The executor and
    // validator consume already-resolved actions and are covered by the typed
    // page-context policy assertion rather than a helper-name source check.
    let page_context_sanitization_owners = [&dispatch_source, &field_focus_source];
    for command in [
        DirectCommandName::ClickElementV2,
        DirectCommandName::FillForm,
        DirectCommandName::SubmitForm,
        DirectCommandName::ReportFocusedField,
    ] {
        let policy = direct_command_policy(command);
        assert_eq!(
            policy.page_context,
            DirectCommandPageContextPolicy::SanitizedSnapshot,
            "{}: page-context commands must require a sanitized snapshot",
            command.as_str()
        );
        assert!(
            page_context_sanitization_owners
                .iter()
                .all(|source| source.contains("redact_page_snapshot_for_remote")),
            "{}: page-context resolver owners must retain the reviewed sanitization helper",
            command.as_str()
        );
    }
'''
          count = evidence_source.count(old_page_context_evidence)
          if count != 1:
              raise SystemExit(
                  f'expected one generated page-context evidence block, found {count}'
              )
          evidence_source = evidence_source.replace(
              old_page_context_evidence,
              new_page_context_evidence,
              1,
          )
          validator_line = '    let validator_source = read_source("app_core/validator.rs");\n'
          count = evidence_source.count(validator_line)
          if count != 1:
              raise SystemExit(f'expected one unused validator source binding, found {count}')
          evidence.write_text(
              evidence_source.replace(validator_line, '', 1),
              encoding='utf-8',
          )

          print('=== generated direct-command evidence test ===')
          for number, line in enumerate(evidence.read_text(encoding='utf-8').splitlines(), 1):
              print(f'{number:04d}: {line}')

          print('=== generated page-context sanitization references ===')
          for path in sorted(Path('src-tauri/src/app_core').rglob('*.rs')):
              matches = []
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  lowered = line.lower()
                  if ('sanitize' in lowered or 'redact' in lowered) and (
                      'page' in lowered or 'context' in lowered or 'snapshot' in lowered
                  ):
                      matches.append((number, line))
              if matches:
                  print(f'--- {path} ---')
                  for number, line in matches:
                      print(f'{number:04d}: {line}')
          PY

      - name: Run fallback and diagnostic scanners
        run: |
          bash scripts/check-silent-fallbacks.sh
          python3 scripts/check-security-fallbacks.py --self-test
          python3 scripts/check-security-fallbacks.py
          python3 scripts/check-security-fallback-inventory.py --self-test
          python3 scripts/check-security-fallback-inventory.py
          python3 scripts/check-sensitive-diagnostics.py --self-test
          python3 scripts/check-sensitive-diagnostics.py

      - name: Normalize and check Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run focused direct-command evidence
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --test post_batch8_direct_command_policy_evidence

      - name: Run Rust tests
        run: xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Run frontend validation
        run: |
          pnpm lint
          pnpm test:ui
          pnpm build

      - name: Commit validated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/BLIND_BROWSER_ACCEPTED_FALLBACKS_2026-08-02.md \
            scripts/check-security-fallback-inventory.py \
            scripts/security-fallback-allowlist.txt \
            scripts/security-fallback-inventory.json \
            src-tauri/src/app_core/command_dispatch.rs \
            src-tauri/src/app_core/fill_correction.rs \
            src-tauri/src/app_core/form_fill/field_focus.rs \
            src-tauri/src/app_core/mod.rs \
            src-tauri/src/app_core/settings_adapters.rs \
            src-tauri/src/app_core/state_snapshots.rs \
            src-tauri/src/app_core/tests/settings_tests.rs \
            src-tauri/src/command_handlers/provider_handlers.rs \
            src-tauri/src/commands/contracts/providers.rs \
            src-tauri/src/commands/registry.rs \
            src-tauri/src/commands/skill_loader.rs \
            src-tauri/src/diagnostic_redaction.rs \
            src-tauri/src/direct_command_policy.rs \
            src-tauri/tests/post_batch8_direct_command_policy_evidence.rs \
            src/tauri-types.ts
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
            exit 1
          fi
          git commit -m 'fix: enforce exact fallback occurrence hardening'
          git push origin HEAD:master

      - name: Publish patch conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if test "${JOB_STATUS}" = success; then
            state=success
            description='Post-P8 enforcement Ralph validation passed'
          else
            state=failure
            description='Post-P8 enforcement Ralph validation failed'
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='ci/post-p8-enforcement-ralph' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
