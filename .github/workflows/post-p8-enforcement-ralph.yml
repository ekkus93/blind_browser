name: Post-P8 Enforcement Ralph

on:
  push:
    branches:
      - master
    paths:
      - '.github/post_p8_enforcement_patch.py'
      - '.github/workflows/post-p8-enforcement-ralph.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: post-p8-enforcement-ralph
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish patch pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='ci/post-p8-enforcement-ralph' \
            -f description='Post-P8 enforcement Ralph validation is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair generator duplicate edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/post_p8_enforcement_patch.py')
          content = path.read_text(encoding='utf-8')

          old_skill = '''for _ in range(2):
              replace_once(
                  "src-tauri/src/commands/skill_loader.rs",
                  """            &available_tool_names,
                      &mut discovered,
                  );
          """,
                  """            &available_tool_names,
                      &mut discovered,
                      &mut diagnostics,
                  );
          """,
              )
          '''
          new_skill = '''skill_loader_calls = read("src-tauri/src/commands/skill_loader.rs")
          old_skill_loader_call = """            &available_tool_names,
                      &mut discovered,
                  );
          """
          new_skill_loader_call = """            &available_tool_names,
                      &mut discovered,
                      &mut diagnostics,
                  );
          """
          count = skill_loader_calls.count(old_skill_loader_call)
          if count != 2:
              raise RuntimeError(
                  f"src-tauri/src/commands/skill_loader.rs: expected two discovery calls, found {count}"
              )
          write(
              "src-tauri/src/commands/skill_loader.rs",
              skill_loader_calls.replace(old_skill_loader_call, new_skill_loader_call),
          )
          '''
          if content.count(old_skill) != 1:
              raise SystemExit('skill-loader duplicate-edit block was not found exactly once')
          content = content.replace(old_skill, new_skill, 1)

          old_provider = '''for _ in range(2):
              replace_once(
                  "src-tauri/src/command_handlers/provider_handlers.rs",
                  """    let settings = app_core.current_remote_planner_settings();
              Ok(RemotePlannerConnectionSettingsData {
                  profile_name,
                  base_url: settings.base_url.unwrap_or_default(),
                  model: settings.model.unwrap_or_default(),
              })
          """,
                  """    let settings = app_core.current_remote_planner_settings();
              completed_remote_planner_connection_settings(profile_name, settings)
          """,
              )
          '''
          new_provider = '''provider_handler_calls = read("src-tauri/src/command_handlers/provider_handlers.rs")
          old_provider_handler_call = """    let settings = app_core.current_remote_planner_settings();
              Ok(RemotePlannerConnectionSettingsData {
                  profile_name,
                  base_url: settings.base_url.unwrap_or_default(),
                  model: settings.model.unwrap_or_default(),
              })
          """
          new_provider_handler_call = """    let settings = app_core.current_remote_planner_settings();
              completed_remote_planner_connection_settings(profile_name, settings)
          """
          count = provider_handler_calls.count(old_provider_handler_call)
          if count != 2:
              raise RuntimeError(
                  f"src-tauri/src/command_handlers/provider_handlers.rs: expected two response blocks, found {count}"
              )
          write(
              "src-tauri/src/command_handlers/provider_handlers.rs",
              provider_handler_calls.replace(old_provider_handler_call, new_provider_handler_call),
          )
          '''
          if content.count(old_provider) != 1:
              raise SystemExit('provider duplicate-edit block was not found exactly once')
          path.write_text(content.replace(old_provider, new_provider, 1), encoding='utf-8')
          PY

      - name: Apply bounded patch
        run: python3 .github/post_p8_enforcement_patch.py

      - name: Repair generated integration output
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding='utf-8')
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one integration match, found {count}: {old[:80]!r}')
              target.write_text(content.replace(old, new, 1), encoding='utf-8')

          # Remove a malformed generated trailing-apostrophe character literal.
          replace_once(
              'src-tauri/src/diagnostic_redaction.rs',
              ", ''',",
              ',',
          )

          # Make the invalid-endpoint fallback's Option<String> type explicit.
          replace_once(
              'src-tauri/src/app_core/settings_adapters.rs',
              '''            sanitize_url_for_display(base_url)
                  .map(|safe| safe.value)
                  .or_else(|| Some(String::from("[REDACTED INVALID ENDPOINT]"))),
          ''',
              '''            Some(
                  sanitize_url_for_display(base_url)
                      .map(|safe| safe.value)
                      .unwrap_or_else(|| String::from("[REDACTED INVALID ENDPOINT]")),
              ),
          ''',
          )

          # Move skill diagnostics from AgentStateData to GetRuntimeStatusData.
          state_path = Path('src-tauri/src/app_core/state_snapshots.rs')
          state = state_path.read_text(encoding='utf-8')
          diagnostics_line = '            skill_discovery_diagnostics: self.last_skill_discovery_diagnostics.clone(),\n'
          if state.count(diagnostics_line) != 1:
              raise SystemExit(f'state snapshots: expected one misplaced diagnostics field, found {state.count(diagnostics_line)}')
          state = state.replace(diagnostics_line, '', 1)
          runtime_tail = '''            } else {
                  None
              },
          }
      }
          '''
          runtime_replacement = '''            } else {
                  None
              },
              skill_discovery_diagnostics: self.last_skill_discovery_diagnostics.clone(),
          }
      }
          '''
          if state.count(runtime_tail) != 1:
              raise SystemExit(f'state snapshots: expected one runtime status tail, found {state.count(runtime_tail)}')
          state_path.write_text(state.replace(runtime_tail, runtime_replacement, 1), encoding='utf-8')

          # Complete the changed remote provider fixture shapes.
          replace_once(
              'src-tauri/src/app_core/planner_redaction.rs',
              '''                audio_format: None,
                  timeout_ms: None,
              },
              remote_asr_settings: RemoteAsrSettings {
          ''',
              '''                audio_format: None,
                  timeout_ms: None,
                  endpoint_is_loopback: None,
                  availability_reason: None,
              },
              remote_asr_settings: RemoteAsrSettings {
          ''',
          )
          replace_once(
              'src-tauri/src/app_core/planner_redaction.rs',
              '''                temperature_milli: None,
                  timeout_ms: None,
              },
              provider_failover_settings: ProviderFailoverSettings {
          ''',
              '''                temperature_milli: None,
                  timeout_ms: None,
                  endpoint_is_loopback: None,
                  availability_reason: None,
              },
              provider_failover_settings: ProviderFailoverSettings {
          ''',
          )

          # Keep the TypeScript runtime-status contract in parity with Rust.
          types_path = Path('src/tauri-types.ts')
          types = types_path.read_text(encoding='utf-8')
          status_marker = '  provider_modes: ProviderSelectionStatus | null;\n'
          if '  skill_discovery_diagnostics: SkillDiscoveryDiagnostics;\n' not in types:
              if types.count(status_marker) != 1:
                  raise SystemExit(f'tauri-types: expected one provider_modes field, found {types.count(status_marker)}')
              types = types.replace(
                  status_marker,
                  status_marker + '  skill_discovery_diagnostics: SkillDiscoveryDiagnostics;\n',
                  1,
              )
              types_path.write_text(types, encoding='utf-8')
          PY

      - name: Run fallback and diagnostic scanners
        run: |
          bash scripts/check-silent-fallbacks.sh
          python3 scripts/check-security-fallbacks.py --self-test
          python3 scripts/check-security-fallbacks.py
          python3 scripts/check-security-fallback-inventory.py --self-test
          python3 scripts/check-security-fallback-inventory.py
          python3 scripts/check-sensitive-diagnostics.py --self-test
          python3 scripts/check-sensitive-diagnostics.py

      - name: Normalize and check Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run focused direct-command evidence
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --test post_batch8_direct_command_policy_evidence

      - name: Run Rust tests
        run: xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Run frontend validation
        run: |
          pnpm lint
          pnpm test:ui
          pnpm build

      - name: Commit validated implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/BLIND_BROWSER_ACCEPTED_FALLBACKS_2026-08-02.md \
            scripts/check-security-fallback-inventory.py \
            scripts/security-fallback-allowlist.txt \
            scripts/security-fallback-inventory.json \
            src-tauri/src/app_core/command_dispatch.rs \
            src-tauri/src/app_core/fill_correction.rs \
            src-tauri/src/app_core/form_fill/field_focus.rs \
            src-tauri/src/app_core/mod.rs \
            src-tauri/src/app_core/settings_adapters.rs \
            src-tauri/src/app_core/state_snapshots.rs \
            src-tauri/src/app_core/tests/settings_tests.rs \
            src-tauri/src/command_handlers/provider_handlers.rs \
            src-tauri/src/commands/contracts/providers.rs \
            src-tauri/src/commands/registry.rs \
            src-tauri/src/commands/skill_loader.rs \
            src-tauri/src/diagnostic_redaction.rs \
            src-tauri/src/direct_command_policy.rs \
            src-tauri/tests/post_batch8_direct_command_policy_evidence.rs \
            src/tauri-types.ts
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
            exit 1
          fi
          git commit -m 'fix: enforce exact fallback occurrence hardening'
          git push origin HEAD:master

      - name: Publish patch conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if test "${JOB_STATUS}" = success; then
            state=success
            description='Post-P8 enforcement Ralph validation passed'
          else
            state=failure
            description='Post-P8 enforcement Ralph validation failed'
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='ci/post-p8-enforcement-ralph' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
