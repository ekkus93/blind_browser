name: Batch 7 Remote Planner Privacy Boundary V3

on:
  push:
    branches:
      - master
    paths:
      - .github/batch7-v3-trigger.txt

permissions:
  contents: write
  issues: write

concurrency:
  group: batch7-remote-planner-privacy-v3
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Publish observable run marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 5 --body "Batch 7 BBCR-003/006 V3 started: head \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`, job \`apply-and-validate\`."

      - name: Refuse unexpected repository state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 6398cb600304ceaa21027af1ba7d8a81a55476bc HEAD
          test -z "$(git status --porcelain)"
          test -z "$(git branch --show-current)"
          test -f scripts/batch7-privacy-boundary.py
          test -f scripts/batch7-v3-apply.py
          test -f .github/workflows/batch7-privacy-boundary-v3.yml
          test -f .github/batch7-v3-trigger.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Ubuntu native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply typed privacy and hostile-input boundary
        run: python3 scripts/batch7-v3-apply.py

      - name: Format transformed Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Verify transformed invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          redaction = Path('src-tauri/src/app_core/planner_redaction.rs').read_text()
          prompt = Path('src-tauri/src/app_core/planner_prompt.rs').read_text()
          remote = Path('src-tauri/src/app_core/remote_planner.rs').read_text()
          required = {
              'redaction': [
                  'pub(crate) struct RemotePlannerInput',
                  'pub(crate) struct PlannerSafeElementAttributes',
                  'remote_planner_high_risk_context_blocked',
                  'use crate::browser::BrowserVisibilityMode;',
                  'use crate::narration::NarrationCursor;',
                  'use crate::state::{BrowserHistoryState, ListeningState, RuntimeAudioState};',
              ],
              'prompt': [
                  'trusted_contract',
                  'user_request',
                  'untrusted_data',
                  'caution-only telemetry',
              ],
              'remote': [
                  'planner_output_schema',
                  'sanitize_remote_planner_input(planner_input)?',
                  'serialize_remote_planner_prompt(&planner_safe_input)?',
                  '"content_length": content.len()',
              ],
          }
          for value in required['redaction']:
              if value not in redaction:
                  raise SystemExit(f'missing redaction invariant: {value}')
          for value in required['prompt']:
              if value not in prompt:
                  raise SystemExit(f'missing prompt invariant: {value}')
          for value in required['remote']:
              if value not in remote:
                  raise SystemExit(f'missing remote invariant: {value}')
          counts = {
              'sanitize': remote.count('sanitize_remote_planner_input(planner_input)?'),
              'serialize': remote.count('serialize_remote_planner_prompt(&planner_safe_input)?'),
              'redacted_response': remote.count('"content_length": content.len()'),
          }
          expected = {'sanitize': 2, 'serialize': 2, 'redacted_response': 2}
          print(f'Batch 7 V3 invariant counts: {counts}')
          if counts != expected:
              raise SystemExit(f'unexpected invariant counts: {counts}')
          forbidden = [
              'pub(crate) planner_input:',
              '"content": content',
              'AvailableTool, BrowserHistoryState',
          ]
          joined = redaction + prompt + remote
          for value in forbidden:
              if value in joined:
                  raise SystemExit(f'forbidden Batch 7 pattern remains: {value}')
          PY
          git diff --check

      - name: Check for reintroduced silent-fallback patterns
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check-silent-fallbacks.sh 2>&1 | tee -a /tmp/batch7-v3-gates.log

      - name: Check Rust formatting
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check 2>&1 | tee -a /tmp/batch7-v3-gates.log

      - name: Check default feature configuration
        shell: bash
        run: |
          set -o pipefail
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee -a /tmp/batch7-v3-gates.log

      - name: Run Rust clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings 2>&1 | tee -a /tmp/batch7-v3-gates.log

      - name: Run Rust tests
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features 2>&1 | tee -a /tmp/batch7-v3-gates.log

      - name: Run frontend lint
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee -a /tmp/batch7-v3-gates.log

      - name: Run UI tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test:ui 2>&1 | tee -a /tmp/batch7-v3-gates.log

      - name: Build frontend
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee -a /tmp/batch7-v3-gates.log

      - name: Remove all one-shot Batch 7 machinery
        shell: bash
        run: |
          rm -f \
            scripts/batch7-privacy-boundary.py \
            scripts/batch7-v3-apply.py \
            scripts/patch-batch7-v2-worker.py \
            .github/workflows/batch7-privacy-boundary.yml \
            .github/batch7-privacy-trigger.txt \
            .github/workflows/batch7-cargo-diagnostic.yml \
            .github/batch7-cargo-diagnostic-trigger.txt \
            .github/workflows/batch7-privacy-boundary-v2.yml \
            .github/batch7-v2-trigger.txt \
            .github/workflows/batch7-v2-worker-fix.yml \
            .github/batch7-v2-worker-fix-trigger.txt \
            .github/workflows/batch7-privacy-boundary-v3.yml \
            .github/batch7-v3-trigger.txt
          git diff --check

      - name: Verify bounded change set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          required = {
              'src-tauri/src/app_core/planner_redaction.rs',
              'src-tauri/src/app_core/planner_prompt.rs',
              'src-tauri/src/app_core/remote_planner.rs',
          }
          allowed = required | {
              'scripts/batch7-privacy-boundary.py',
              'scripts/batch7-v3-apply.py',
              'scripts/patch-batch7-v2-worker.py',
              '.github/workflows/batch7-privacy-boundary.yml',
              '.github/batch7-privacy-trigger.txt',
              '.github/workflows/batch7-cargo-diagnostic.yml',
              '.github/batch7-cargo-diagnostic-trigger.txt',
              '.github/workflows/batch7-privacy-boundary-v2.yml',
              '.github/batch7-v2-trigger.txt',
              '.github/workflows/batch7-v2-worker-fix.yml',
              '.github/batch7-v2-worker-fix-trigger.txt',
              '.github/workflows/batch7-privacy-boundary-v3.yml',
              '.github/batch7-v3-trigger.txt',
          }
          if not required.issubset(changed):
              raise SystemExit(f'missing required production changes: {sorted(required - changed)}')
          if not changed.issubset(allowed):
              raise SystemExit(f'unexpected changed paths: {sorted(changed - allowed)}')
          print(f'Bounded Batch 7 V3 changes: {sorted(changed)}')
          PY

      - name: Commit validated source to master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security: type remote planner privacy boundary"
          source_sha="$(git rev-parse HEAD)"
          git push origin HEAD:master
          git push origin --delete agent/tmp-do-not-use || true
          gh issue comment 5 --body "Batch 7 BBCR-003/006 V3 passed and was committed to master: trigger head \`${GITHUB_SHA}\`, source commit \`${source_sha}\`, run \`${GITHUB_RUN_ID}\`, job \`apply-and-validate\`."

      - name: Publish failure marker
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Batch 7 BBCR-003/006 V3 failed: head \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`, job \`apply-and-validate\`. No production source commit was published."
            echo
            echo '```text'
            tail -c 7000 /tmp/batch7-v3-gates.log 2>/dev/null || true
            echo
            echo '```'
          } > /tmp/batch7-v3-failure.md
          gh issue comment 5 --body-file /tmp/batch7-v3-failure.md
