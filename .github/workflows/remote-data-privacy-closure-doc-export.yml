name: Remote Data Privacy Closure Documentation Publisher

on:
  push:
    branches:
      - master
    paths:
      - .github/remote-data-privacy-closure-doc-export.trigger

permissions:
  contents: write

concurrency:
  group: remote-data-privacy-closure-doc-publisher
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: "${{ github.event.head_commit.message == 'ci: trigger privacy closure documentation publish' }}"
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out exact trigger SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify bounded patches
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(cat .github/remote-data-privacy-closure-doc-export.trigger)" = "remote-data-privacy-closure-doc-publish-v5"

          find .github -maxdepth 1 -type f \
            -name 'remote-data-privacy-closure-docs.patch.gz.b64.part-*' \
            -print | sort > /tmp/payload-paths.txt
          test "$(wc -l < /tmp/payload-paths.txt)" -eq 14
          mapfile -t parts < /tmp/payload-paths.txt
          for part in "${parts[@]}"; do
            test -f "${part}"
            test -s "${part}"
            test "$(wc -l < "${part}")" -le 1
          done

          cat "${parts[@]}" > /tmp/remote-data-privacy-closure-docs.patch.gz.b64
          echo "d368a988127a973f417979bfd64d245ab8a00dcabe4e55ce8aab2f8bcc650c7e  /tmp/remote-data-privacy-closure-docs.patch.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/remote-data-privacy-closure-docs.patch.gz.b64 > /tmp/remote-data-privacy-closure-docs.patch.gz
          gzip --test /tmp/remote-data-privacy-closure-docs.patch.gz
          gzip --decompress --stdout /tmp/remote-data-privacy-closure-docs.patch.gz > /tmp/remote-data-privacy-closure-docs.patch
          echo "652d28c00ce72641cb0de73caadd12d5cd75a5f758bd631c9c14c8604924699e  /tmp/remote-data-privacy-closure-docs.patch" | sha256sum --check --strict
          git apply --check /tmp/remote-data-privacy-closure-docs.patch
          git apply /tmp/remote-data-privacy-closure-docs.patch

          find .github -maxdepth 1 -type f \
            -name 'remote-data-privacy-closure-new-files.patch.gz.part-*' \
            -print | sort > /tmp/new-payload-paths.txt
          test "$(wc -l < /tmp/new-payload-paths.txt)" -eq 8
          mapfile -t new_parts < /tmp/new-payload-paths.txt
          for part in "${new_parts[@]}"; do
            test -f "${part}"
            test -s "${part}"
          done

          cat "${new_parts[@]}" > /tmp/remote-data-privacy-closure-new-files.patch.gz
          echo "cd136224416eb33c72f5877307a8e2bd5c100b0c05ca9cb4e59434fa99fedbb8  /tmp/remote-data-privacy-closure-new-files.patch.gz" | sha256sum --check --strict
          gzip --test /tmp/remote-data-privacy-closure-new-files.patch.gz
          gzip --decompress --stdout /tmp/remote-data-privacy-closure-new-files.patch.gz > /tmp/remote-data-privacy-closure-new-files.patch
          echo "4326dfdc4f0d27c1181dc8bae34f9b83f733db884571f4e1f7b5a3498f593899  /tmp/remote-data-privacy-closure-new-files.patch" | sha256sum --check --strict
          git apply --check /tmp/remote-data-privacy-closure-new-files.patch
          git apply /tmp/remote-data-privacy-closure-new-files.patch

          corrected_new_files=(
            docs/BLIND_BROWSER_REMOTE_DATA_PRIVACY_MILESTONE_CLOSURE_REPORT_2026-08-05.md
            docs/BLIND_BROWSER_REMOTE_DATA_PRIVACY_MILESTONE_RECONCILIATION_2026-08-05.md
            docs/BLIND_BROWSER_REMOTE_DATA_PRIVACY_THREAT_MODEL_2026-08-05.md
            docs/REMOTE_PLANNER_PRIVACY.md
            src/settings-panels/planner-privacy-confirmation-interactions.test.mjs
            src/settings-panels/planner-privacy-confirmation-interactions.ts
          )
          sed -i 's/[[:blank:]]\+$//' "${corrected_new_files[@]}"
          git add --intent-to-add -- "${corrected_new_files[@]}"
          git diff --binary -- "${corrected_new_files[@]}" > /tmp/remote-data-privacy-closure-corrected-new-files.patch
          echo "3c1c3bd9439ac2f226c366d3e49ced6afa15971e1f0bda1775b7b7229db2991c  /tmp/remote-data-privacy-closure-corrected-new-files.patch" | sha256sum --check --strict

          cat > /tmp/expected-source-paths.txt <<'PATHS'
          docs/BLIND_BROWSER_COMPREHENSIVE_CODE_REVIEW_FIX_TODO_2026-08-01.md
          docs/BLIND_BROWSER_POST_BATCH8_RECONCILIATION_2026-08-02.md
          docs/BLIND_BROWSER_REMOTE_DATA_CONSENT_ORIGIN_PRIVACY_IMPLEMENTATION_REPORT_2026-08-03.md
          docs/BLIND_BROWSER_REMOTE_DATA_CONSENT_ORIGIN_PRIVACY_TODO_2026-08-03.md
          docs/BLIND_BROWSER_REMOTE_DATA_PRIVACY_MILESTONE_CLOSURE_REPORT_2026-08-05.md
          docs/BLIND_BROWSER_REMOTE_DATA_PRIVACY_MILESTONE_CLOSURE_TODO_2026-08-05.md
          docs/BLIND_BROWSER_REMOTE_DATA_PRIVACY_MILESTONE_RECONCILIATION_2026-08-05.md
          docs/BLIND_BROWSER_REMOTE_DATA_PRIVACY_THREAT_MODEL_2026-08-05.md
          docs/REMOTE_PLANNER_PRIVACY.md
          docs/SPECS.md
          src/remote-planner-consent-dialog-interactions.test.mjs
          src/remote-planner-consent-dialog-interactions.ts
          src/remote-planner-privacy-ui.test.mjs
          src/remote-planner-privacy-ui.tsx
          src/settings-panels/planner-privacy-confirmation-interactions.test.mjs
          src/settings-panels/planner-privacy-confirmation-interactions.ts
          src/settings-panels/planner-privacy.test.mjs
          src/settings-panels/planner-privacy.tsx
          PATHS
          sed -i 's/^          //' /tmp/expected-source-paths.txt
          sort -u /tmp/expected-source-paths.txt -o /tmp/expected-source-paths.txt
          mapfile -t source_paths < /tmp/expected-source-paths.txt
          git add --intent-to-add -- "${source_paths[@]}"
          git diff --name-only | sort -u > /tmp/actual-source-paths.txt
          diff -u /tmp/expected-source-paths.txt /tmp/actual-source-paths.txt
          test "$(wc -l < /tmp/actual-source-paths.txt)" -eq 18
          git diff --check

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Ubuntu native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run permanent privacy and fallback scanners
        run: |
          bash scripts/check-silent-fallbacks.sh
          python3 scripts/check-security-fallbacks.py --self-test
          python3 scripts/check-security-fallbacks.py
          python3 scripts/check-security-fallback-inventory.py --self-test
          python3 scripts/check-security-fallback-inventory.py
          python3 scripts/check-sensitive-diagnostics.py --self-test
          python3 scripts/check-sensitive-diagnostics.py
          python3 scripts/check-remote-planner-privacy-state.py --self-test
          python3 scripts/check-remote-planner-privacy-state.py

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Check default feature configuration
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run strict Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run focused direct-command semantic evidence
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --test post_batch8_direct_command_policy_evidence

      - name: Run complete Rust and process-isolated Wry evidence
        run: bash scripts/run-rust-tests-linux.sh

      - name: Run frontend lint, UI tests, and build
        run: |
          pnpm lint
          pnpm test:ui
          pnpm build

      - name: Publish exact validated closure batch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          test "$(git rev-parse origin/master)" = "${GITHUB_SHA}"

          mapfile -t source_paths < /tmp/expected-source-paths.txt
          mapfile -t payload_paths < /tmp/payload-paths.txt
          mapfile -t new_payload_paths < /tmp/new-payload-paths.txt
          test "${#payload_paths[@]}" -eq 14
          test "${#new_payload_paths[@]}" -eq 8
          git add -- "${source_paths[@]}"
          git rm -- \
            .github/remote-data-privacy-closure-doc-export.trigger \
            "${payload_paths[@]}" \
            "${new_payload_paths[@]}"

          cat /tmp/expected-source-paths.txt > /tmp/expected-publish-paths.txt
          printf '%s\n' .github/remote-data-privacy-closure-doc-export.trigger >> /tmp/expected-publish-paths.txt
          cat /tmp/payload-paths.txt >> /tmp/expected-publish-paths.txt
          cat /tmp/new-payload-paths.txt >> /tmp/expected-publish-paths.txt
          sort -u /tmp/expected-publish-paths.txt -o /tmp/expected-publish-paths.txt
          git diff --cached --name-only | sort -u > /tmp/actual-publish-paths.txt
          diff -u /tmp/expected-publish-paths.txt /tmp/actual-publish-paths.txt
          test "$(wc -l < /tmp/actual-publish-paths.txt)" -eq 41
          git diff --cached --check
          test -z "$(git diff --name-only)"
          test -z "$(git status --short --untracked-files=all | grep '^??' || true)"

          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git commit -m "docs: close remote data privacy milestone"
          git push origin HEAD:master
