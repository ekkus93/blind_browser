name: CR3 Remote Speech Authorization Repair Validation

on:
  push:
    branches:
      - cr3-remote-speech-materialize
    paths:
      - .github/cr3-remote-speech-repair.trigger

permissions:
  contents: write

jobs:
  validate-and-checkpoint:
    if: "${{ github.event.head_commit.message == 'ci: validate remote speech authorization repair' }}"
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      REPAIR_BASE_SHA: 5879747178df9ba77f7ac0a2f879a644c5890abc
    steps:
      - name: Check out exact trigger SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify repair transport lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(cat .github/cr3-remote-speech-repair.trigger)" = "validate-v4"
          git merge-base --is-ancestor "${REPAIR_BASE_SHA}" HEAD
          git diff --name-only "${REPAIR_BASE_SHA}"..HEAD | sort > /tmp/actual-transport.txt
          cat > /tmp/expected-transport.txt <<'EOF'
          .github/cr3-remote-speech-repair.patch.gz.b64
          .github/cr3-remote-speech-repair.patch.gz.b64.part-00
          .github/cr3-remote-speech-repair.patch.gz.b64.part-01
          .github/cr3-remote-speech-repair.patch.gz.b64.part-02
          .github/cr3-remote-speech-repair.patch.gz.b64.part-03
          .github/cr3-remote-speech-repair.patch.gz.b64.part-04
          .github/cr3-remote-speech-repair.patch.gz.b64.part-05
          .github/cr3-remote-speech-repair.patch.gz.b64.part-06
          .github/cr3-remote-speech-repair.patch.gz.b64.part-07
          .github/cr3-remote-speech-repair.patch.gz.b64.part-08
          .github/cr3-remote-speech-repair.patch.gz.b64.part-08-0
          .github/cr3-remote-speech-repair.patch.gz.b64.part-08-1
          .github/cr3-remote-speech-repair.patch.gz.b64.part-08-2
          .github/cr3-remote-speech-repair.patch.gz.b64.part-08-3
          .github/cr3-remote-speech-repair.patch.gz.b64.part-08-4
          .github/cr3-remote-speech-repair.patch.gz.b64.part-09
          .github/cr3-remote-speech-repair.trigger
          .github/workflows/cr3-remote-speech-repair-validate.yml
          EOF
          diff -u /tmp/expected-transport.txt /tmp/actual-transport.txt

      - name: Reconstruct exact bounded repair
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/part-checksums.txt <<'EOF'
          30935b1585820f5f8a9ab0be78339a8a9ab95d0de7012282427118994a812571  .github/cr3-remote-speech-repair.patch.gz.b64.part-00
          15070a05fd3f2433b946c814fdfcef4af56cb8a052e6658cafe98683f7480410  .github/cr3-remote-speech-repair.patch.gz.b64.part-01
          359a99e2e08afc3122e67228b6ae8c190c5910bb89c5992094f5a13ec4472b20  .github/cr3-remote-speech-repair.patch.gz.b64.part-02
          2bd883cf219e48460229728c1a297cd833c78564d1690f44a6591e6a3d8f50c2  .github/cr3-remote-speech-repair.patch.gz.b64.part-03
          fd826b30fcdee7700cad4390619d9bc52e0851e240dcc7ca80f098da05931f78  .github/cr3-remote-speech-repair.patch.gz.b64.part-04
          022bfe40035264e2247a8634abd9310c9e46589ff7bbce6ad14701a51f19bf6c  .github/cr3-remote-speech-repair.patch.gz.b64.part-05
          3511ae79fa8ef768d3dd3ae8f7190243db5fd6c518390240c7860190befb6f8d  .github/cr3-remote-speech-repair.patch.gz.b64.part-06
          a458c10f03ca0b0d5b3987c50435b7d8fa9c2169a2c8afc0927cbe5b582fa3ea  .github/cr3-remote-speech-repair.patch.gz.b64.part-07
          073a05e943e2f580f7ae79250dc24841cae03943474966bc8b14c87c92bb4d48  .github/cr3-remote-speech-repair.patch.gz.b64.part-08-0
          589d21357bf84bcc12515cb84c36a1463e42b6c47cb696c9dac675fd5caabec0  .github/cr3-remote-speech-repair.patch.gz.b64.part-08-1
          d8cd0e88600ccf07f3119d7a4075375675ed5adca1989b7cd735bc308e6fd7b1  .github/cr3-remote-speech-repair.patch.gz.b64.part-08-2
          6f96d0eb89c747984dded04660bbf4933619d2c6d7685dfcf7509bb767361a09  .github/cr3-remote-speech-repair.patch.gz.b64.part-08-3
          4887817753dca1f37853482e683737ef38cdc56bbbd3d87a88151167ca2dfe35  .github/cr3-remote-speech-repair.patch.gz.b64.part-08-4
          92fa2465f2c7fa2af9d544e943d20ddf66c85bc79ad33d53f5117d2b447534a9  .github/cr3-remote-speech-repair.patch.gz.b64.part-09
          EOF
          sha256sum --check --strict /tmp/part-checksums.txt
          cat \
            .github/cr3-remote-speech-repair.patch.gz.b64.part-00 \
            .github/cr3-remote-speech-repair.patch.gz.b64.part-01 \
            .github/cr3-remote-speech-repair.patch.gz.b64.part-02 \
            .github/cr3-remote-speech-repair.patch.gz.b64.part-03 \
            .github/cr3-remote-speech-repair.patch.gz.b64.part-04 \
            .github/cr3-remote-speech-repair.patch.gz.b64.part-05 \
            .github/cr3-remote-speech-repair.patch.gz.b64.part-06 \
            .github/cr3-remote-speech-repair.patch.gz.b64.part-07 \
            .github/cr3-remote-speech-repair.patch.gz.b64.part-08-0 \
            .github/cr3-remote-speech-repair.patch.gz.b64.part-08-1 \
            .github/cr3-remote-speech-repair.patch.gz.b64.part-08-2 \
            .github/cr3-remote-speech-repair.patch.gz.b64.part-08-3 \
            .github/cr3-remote-speech-repair.patch.gz.b64.part-08-4 \
            .github/cr3-remote-speech-repair.patch.gz.b64.part-09 \
            > /tmp/cr3-remote-speech-repair.patch.gz.b64
          test "$(wc -c < /tmp/cr3-remote-speech-repair.patch.gz.b64)" -eq 49012
          echo "c9e32417ac5401b440e9c66fe58233f3c820a0b82b7456861695387cafb7519b  /tmp/cr3-remote-speech-repair.patch.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/cr3-remote-speech-repair.patch.gz.b64 > /tmp/cr3-remote-speech-repair.patch.gz
          echo "408578fc1299114f6feb237e168df9593efcd6cb2633df3e15e490828e76b926  /tmp/cr3-remote-speech-repair.patch.gz" | sha256sum --check --strict
          gzip --test /tmp/cr3-remote-speech-repair.patch.gz
          gzip --decompress --stdout /tmp/cr3-remote-speech-repair.patch.gz > /tmp/cr3-remote-speech-repair.patch
          echo "82d44226a5853167cec6778fbc240a9df3cc2639131e9343b47201b9e7cc30c9  /tmp/cr3-remote-speech-repair.patch" | sha256sum --check --strict
          git apply --check /tmp/cr3-remote-speech-repair.patch
          git apply /tmp/cr3-remote-speech-repair.patch
          rm -f \
            .github/cr3-remote-speech-repair.patch.gz.b64 \
            .github/cr3-remote-speech-repair.patch.gz.b64.part-* \
            .github/cr3-remote-speech-repair.trigger \
            .github/workflows/cr3-remote-speech-repair-validate.yml
          git diff --check

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Ubuntu native dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Check repository whitespace
        run: git diff --check

      - name: Run permanent privacy and fallback scanners
        run: |
          bash scripts/check-silent-fallbacks.sh
          python3 scripts/check-security-fallbacks.py --self-test
          python3 scripts/check-security-fallbacks.py
          python3 scripts/check-security-fallback-inventory.py --self-test
          python3 scripts/check-security-fallback-inventory.py
          python3 scripts/check-sensitive-diagnostics.py --self-test
          python3 scripts/check-sensitive-diagnostics.py
          python3 scripts/check-remote-planner-privacy-state.py --self-test
          python3 scripts/check-remote-planner-privacy-state.py

      - name: Check default feature configuration
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run strict Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run focused remote speech privacy evidence
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --all-features remote_data_consent
          cargo test --manifest-path src-tauri/Cargo.toml --all-features remote_narration
          cargo test --manifest-path src-tauri/Cargo.toml --all-features remote_microphone

      - name: Run complete Rust suite
        run: bash scripts/run-rust-tests-linux.sh

      - name: Run frontend lint
        run: pnpm lint

      - name: Run UI tests
        run: pnpm test:ui

      - name: Build frontend
        run: pnpm build

      - name: Run structural authorization assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -F "authorization: RemoteTtsAuthorization" src-tauri/src/tts/remote.rs
          grep -F "authorization: RemoteAsrAuthorization" src-tauri/src/asr/remote.rs
          ! grep -R -F "RemoteTtsAuthorization::for_test" src-tauri/src
          ! grep -R -F "authorized_retry_required" src src-tauri/src
          ! grep -R -F "captured audio was not sent and has been discarded" src
          test ! -e .github/cr3-remote-speech-clippy.exit
          test ! -e .github/cr3-remote-speech-clippy.trigger
          test ! -e .github/cr3-remote-speech-clippy.txt
          test ! -e .github/cr3-remote-speech-export.trigger
          test ! -e .github/workflows/cr3-remote-speech-clippy-diagnostic.yml
          test ! -e .github/workflows/cr3-remote-speech-export.yml
          test ! -e .github/cr3-remote-speech-repair.patch.gz.b64
          test -z "$(find .github -maxdepth 1 -type f -name 'cr3-remote-speech-repair.patch.gz.b64.part-*' -print -quit)"
          test ! -e .github/cr3-remote-speech-repair.trigger
          test ! -e .github/workflows/cr3-remote-speech-repair-validate.yml
          git diff --check

      - name: Commit validated implementation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: enforce typed remote speech authorization"
          git push origin HEAD:cr3-remote-speech-materialize
