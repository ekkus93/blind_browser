name: BBCR-008-012 Source Export

on:
  push:
    branches:
      - master
    paths:
      - .github/bbcr-008-012-source-export.trigger

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package exact source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf '%s\n' "${GITHUB_SHA}" > SOURCE_SHA.txt
          tar \
            --exclude=.git \
            --exclude=bbcr-008-012-source.tar.gz \
            -czf bbcr-008-012-source.tar.gz .
          sha256sum bbcr-008-012-source.tar.gz > bbcr-008-012-source.tar.gz.sha256

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: bbcr-008-012-source-${{ github.sha }}
          path: |
            bbcr-008-012-source.tar.gz
            bbcr-008-012-source.tar.gz.sha256
            SOURCE_SHA.txt
          if-no-files-found: error
          retention-days: 1
