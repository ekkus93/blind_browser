# Temporary bounded runner. Removed after the validated source commit lands.
name: Post-Batch-8 Ralph Patch

on:
  push:
    branches:
      - master
    paths:
      - .github/post_batch8_ralph_patch.py
      - .github/workflows/post-batch8-ralph-patch.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: post-batch8-ralph-patch
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact master candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish patch pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='ralph/post-batch8-patch' \
            -f description='Post-Batch-8 source patch is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install native test dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Prune stale exact fallback metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          allowlist = root / "scripts/security-fallback-allowlist.txt"

          def normalize(line: str) -> str:
              return " ".join(line.strip().split())

          retained = []
          removed = []
          for raw in allowlist.read_text(encoding="utf-8").splitlines():
              stripped = raw.strip()
              if not stripped or stripped.startswith("#"):
                  retained.append(raw)
                  continue
              path, expression = stripped.split("|", 1)
              source_path = root / path
              live = source_path.exists() and any(
                  normalize(line) == expression
                  for line in source_path.read_text(encoding="utf-8", errors="replace").splitlines()
              )
              if live:
                  retained.append(raw)
              else:
                  removed.append(stripped)
          allowlist.write_text("\n".join(retained).rstrip() + "\n", encoding="utf-8")
          for entry in removed:
              print(f"Pruned stale fallback allowlist entry: {entry}")
          PY

      - name: Reconcile generated evidence assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/post_batch8_ralph_patch.py")
          source = path.read_text(encoding="utf-8")

          old_assertion = '    assert!(api_keys.contains(".timeout(Duration::from_millis(timeout_ms.max(1)))"));\n'
          new_assertion = (
              '    assert!(api_keys.contains("fn credential_async_client(timeout_ms: u64)"));\n'
              '    assert!(api_keys.contains("fn credential_client(timeout_ms: u64, purpose: &str)"));\n'
              '    assert!(api_keys.matches("timeout_ms.max(1)").count() >= 2);\n'
          )
          if source.count(old_assertion) != 1:
              raise SystemExit("expected one brittle timeout assertion")
          source = source.replace(old_assertion, new_assertion, 1)

          old_cleanup = '            cleanup_failed_screenshot_write(&path, &io_error)?;\n'
          new_cleanup = '            drop(file);\n            cleanup_failed_screenshot_write(&path, &io_error)?;\n'
          if source.count(old_cleanup) != 1:
              raise SystemExit("expected one screenshot cleanup call in generated patch")
          source = source.replace(old_cleanup, new_cleanup, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Apply and validate bounded patch
        run: python3 .github/post_batch8_ralph_patch.py

      - name: Commit validated source and evidence changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/ci.yml \
            docs/BLIND_BROWSER_ACCEPTED_FALLBACKS_2026-08-02.md \
            scripts/check-security-fallback-inventory.py \
            scripts/security-fallback-allowlist.txt \
            scripts/security-fallback-inventory.json \
            src-tauri/src/app_core/image_cache.rs \
            src-tauri/src/app_core/planner_redaction.rs \
            src-tauri/src/config/persistence.rs \
            src-tauri/tests/post_batch8_direct_command_policy_evidence.rs
          git diff --cached --check
          git commit -m 'test: close post-Batch-8 source evidence gaps'
          git push origin HEAD:master

      - name: Publish patch conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if test "${JOB_STATUS}" = success; then
            state=success
            description='Post-Batch-8 source patch passed and published'
          else
            state=failure
            description='Post-Batch-8 source patch failed'
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='ralph/post-batch8-patch' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
