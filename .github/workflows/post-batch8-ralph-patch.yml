# Temporary bounded runner. Retriggered after generated-evidence formatting fix.
name: Post-Batch-8 Ralph Patch

on:
  push:
    branches:
      - master
    paths:
      - .github/post_batch8_ralph_patch.py
      - .github/workflows/post-batch8-ralph-patch.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: post-batch8-ralph-patch
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact master candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish patch pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='ralph/post-batch8-patch' \
            -f description='Post-Batch-8 source patch is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install native test dependencies
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            clang \
            libclang-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            xvfb

      - name: Reconcile patch generator and stale metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import import Path
          PY
