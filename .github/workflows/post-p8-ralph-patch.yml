name: Post-P8 Ralph Patch

on:
  push:
    branches:
      - master
    paths:
      - .github/post_p8_ralph_patch.py
      - .github/workflows/post-p8-ralph-patch.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: post-p8-ralph-patch
  cancel-in-progress: true

jobs:
  apply-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Publish Ralph pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='ralph/post-p8-fallback-evidence' \
            -f description='Post-P8 Ralph validation is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Ubuntu native dependencies
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y \
              libwebkit2gtk-4.1-dev \
              build-essential \
              clang \
              libclang-dev \
              curl \
              wget \
              file \
              libxdo-dev \
              libssl-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libasound2-dev \
              libleptonica-dev \
              libtesseract-dev \
              tesseract-ocr \
              xvfb && break
            test "$attempt" = 3 && exit 1
            sleep $((attempt * 10))
          done

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair temporary patch runner repetition guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/post_p8_ralph_patch.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              "src-tauri/src/commands/planner_executor/execution.rs",
              "details: serde_json::to_value(decision).ok(),",
              "details: policy_details(serde_json::to_value(decision)),",
          )
          # The expression occurs three times; replace the remaining two deliberately.
          for _ in range(2):
              replace_once(
                  "src-tauri/src/commands/planner_executor/execution.rs",
                  "details: serde_json::to_value(decision).ok(),",
                  "details: policy_details(serde_json::to_value(decision)),",
              )
          '''
          new = '''execution_path = "src-tauri/src/commands/planner_executor/execution.rs"
          execution_text = read(execution_path)
          old_policy_details = "details: serde_json::to_value(decision).ok(),"
          if execution_text.count(old_policy_details) != 3:
              raise SystemExit("expected three executor policy detail fallbacks")
          write(
              execution_path,
              execution_text.replace(
                  old_policy_details,
                  "details: policy_details(serde_json::to_value(decision)),",
              ),
          )
          '''
          if old not in text:
              raise SystemExit('temporary repetition block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile .github/post_p8_ralph_patch.py

      - name: Apply bounded patch
        run: python3 .github/post_p8_ralph_patch.py

      - name: Repair generated integration details
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'expected one generated match in {path}: {old!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src-tauri/src/diagnostic_redaction.rs',
              '    if parsed.host_str().is_none() {\n        return None;\n    }',
              '    parsed.host_str()?;',
          )
          replace_once(
              'src-tauri/src/app_core/tests/settings_tests.rs',
              'let model_settings = build_model_management_settings(&unknown_models);',
              'let model_settings = crate::app_core::settings_adapters::build_model_management_settings(&unknown_models);',
          )
          replace_once(
              'src-tauri/src/app_core/tests/settings_tests.rs',
              'let valid = build_model_management_settings(&AppConfig::default());',
              'let valid = crate::app_core::settings_adapters::build_model_management_settings(&AppConfig::default());',
          )
          replace_once(
              'src-tauri/src/app_core/planner_redaction.rs',
              '                endpoint_is_loopback: Some(false),\n                consent_to_remote_page_data: true,',
              '                endpoint_is_loopback: Some(false),\n                availability_reason: None,\n                consent_to_remote_page_data: true,',
          )
          PY

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Validate scanners
        run: |
          bash scripts/check-silent-fallbacks.sh
          python3 scripts/check-security-fallbacks.py --self-test
          python3 scripts/check-security-fallbacks.py
          python3 scripts/check-security-fallback-inventory.py --self-test
          python3 scripts/check-security-fallback-inventory.py
          python3 scripts/check-sensitive-diagnostics.py --self-test
          python3 scripts/check-sensitive-diagnostics.py

      - name: Cargo check
        shell: bash
        run: |
          set -o pipefail
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee /tmp/cargo-check.log

      - name: Cargo clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/cargo-clippy.log

      - name: Cargo test
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --all-features 2>&1 | tee /tmp/cargo-test.log

      - name: Upload Rust failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: post-p8-rust-failure-${{ github.run_id }}
          path: /tmp/cargo-*.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Validate frontend
        run: |
          pnpm lint
          pnpm test:ui
          pnpm build

      - name: Check patch formatting
        shell: bash
        run: |
          git diff --check
          git status --short

      - name: Publish validated source patch to master
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/BLIND_BROWSER_ACCEPTED_FALLBACKS_2026-08-02.md \
            scripts/check-security-fallback-inventory.py \
            scripts/security-fallback-allowlist.txt \
            scripts/security-fallback-inventory.json \
            src-tauri/src/app_core/mod.rs \
            src-tauri/src/app_core/planner_redaction.rs \
            src-tauri/src/app_core/settings_adapters.rs \
            src-tauri/src/app_core/tests/settings_tests.rs \
            src-tauri/src/commands/contracts/providers.rs \
            src-tauri/src/commands/planner_executor/execution.rs \
            src-tauri/src/commands/skill_loader.rs \
            src-tauri/src/commands/validators/mod.rs \
            src-tauri/src/diagnostic_redaction.rs \
            src-tauri/src/direct_command_policy.rs \
            src-tauri/tests/post_batch8_direct_command_policy_evidence.rs \
            src/tauri-types.ts
          git diff --cached --check
          git commit -m 'fix: harden post-P8 fallbacks and semantic evidence'
          git push origin HEAD:master

      - name: Publish Ralph conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if test "${JOB_STATUS}" = success; then
            state=success
            description='Post-P8 Ralph validation passed'
          else
            state=failure
            description='Post-P8 Ralph validation failed'
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='ralph/post-p8-fallback-evidence' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
