name: Remote Data Privacy Closure Source Export

on:
  push:
    branches:
      - master
    paths:
      - .github/remote-data-privacy-closure-export.trigger

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create exact source archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=target \
            --exclude=node_modules \
            -czf /tmp/blind-browser-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: blind-browser-source
          path: /tmp/blind-browser-source.tar.gz
          if-no-files-found: error
          retention-days: 1
