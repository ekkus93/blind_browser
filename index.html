<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>blind_browser</title>
    <!--
      Network font dependency: Fraunces (display) + IBM Plex Sans (UI body) via Google Fonts.
      Requires network access on first load; subsequent loads are served from the browser cache.
      Offline users get the CSS fallback stack (Georgia / Segoe UI / sans-serif).
      Local font bundling is deferred — tracked as P2.1 in docs/BLIND_BROWSER_UIUX_FIX3_TODO.md.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=IBM+Plex+Sans:wght@400;600;700&display=swap"
    />
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
