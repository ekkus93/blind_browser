[package]
name = "blind_browser"
version = "0.1.0"
description = "Voice-first desktop browser for vision-impaired users"
edition = "2021"

[lib]
name = "blind_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
futures = "0.3"
keyring = "3.6.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "multipart"] }
url = "2"
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.10.3", features = ["tracing"] }
thiserror = "2.0"
# Time driver only, for bounding browser navigation futures via tokio::time::timeout
# inside tauri::async_runtime::block_on (Tauri's runtime enables the time driver).
tokio = { version = "1", features = ["time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = "1"

async-openai = { version = "0.33.1", optional = true, features = ["chat-completion", "audio"] }
chromiumoxide = { version = "0.9.1", optional = true }
cpal = { version = "0.17.3", optional = true }
dom_smoothie = { version = "0.16.0", optional = true }
kitten_tts = { package = "kitten-tts", git = "https://github.com/ekkus93/kitten_tts_rs.git", rev = "df7718161bc68c8b13bea85e879308becf12e87b", optional = true }
leptess = { version = "0.14.0", optional = true }
rodio = { version = "0.22.2", optional = true }
whisper-rs = { version = "0.16.0", optional = true }

[features]
# This is an application crate with no consumer of a minimal build, and the only
# no-feature `cargo build` (scripts/darkmode-test.sh) expects the default config to
# work. Default to the full, CI-tested feature set so `cargo build`/`cargo check`
# and rust-analyzer work with no flags. `--no-default-features` is intentionally
# unsupported (the per-item #[cfg] gating for a minimal build is incomplete).
default = ["full"]
browser = ["dep:chromiumoxide", "dep:dom_smoothie"]
ocr = ["dep:leptess"]
audio = ["dep:cpal", "dep:rodio"]
local-tts = ["dep:kitten_tts"]
local-asr = ["dep:whisper-rs"]
remote-openai = ["dep:async-openai"]
full = ["browser", "ocr", "audio", "local-tts", "local-asr", "remote-openai"]

[dev-dependencies]
tempfile = "3"
