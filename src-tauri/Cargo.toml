[package]
name = "blind_browser"
version = "0.1.0"
description = "Voice-first desktop browser for vision-impaired users"
edition = "2021"

[lib]
name = "blind_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6" }

[dependencies]
futures = "0.3"
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.10.3", features = ["tracing"] }
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

async-openai = { version = "0.33.1", optional = true }
chromiumoxide = { version = "0.9.1", optional = true }
cpal = { version = "0.17.3", optional = true }
dom_smoothie = { version = "0.16.0", optional = true }
kitten_tts = { package = "kitten-tts", git = "https://github.com/ekkus93/kitten_tts_rs.git", optional = true }
leptess = { version = "0.14.0", optional = true }
rodio = { version = "0.22.2", optional = true }
whisper-rs = { version = "0.16.0", optional = true }

[features]
default = []
browser = ["dep:chromiumoxide", "dep:dom_smoothie"]
ocr = ["dep:leptess"]
audio = ["dep:cpal", "dep:rodio"]
local-tts = ["dep:kitten_tts"]
local-asr = ["dep:whisper-rs"]
remote-openai = ["dep:async-openai"]
full = ["browser", "ocr", "audio", "local-tts", "local-asr", "remote-openai"]